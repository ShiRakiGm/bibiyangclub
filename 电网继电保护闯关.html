<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电流防线 · 继电保护闯关实训</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070d14'/%3E%3Cpath d='M18 4L8 18h6l-2 10 12-15h-7z' fill='%233ed6c4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --bg:#070d14; --bg2:#0a131d; --panel:#0d1824; --panel2:#112130;
  --line:#1d2f3f; --line2:#2b4557; --ink:#e6f0f8; --muted:#8ba3b7; --dim:#5e7488;
  --cyan:#3ed6c4; --amber:#f4b74a; --red:#f2636f; --blue:#6ea8ff; --violet:#a99cf5;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:400;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  background-image:
    radial-gradient(1100px 600px at 78% -10%, rgba(62,214,196,.10), transparent 60%),
    radial-gradient(900px 500px at 8% 105%, rgba(110,168,255,.08), transparent 65%),
    linear-gradient(180deg,#070d14 0%,#08111a 100%);
  background-attachment:fixed;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:rgba(62,214,196,.25)}
button{font-family:inherit}

/* ============ 顶栏 ============ */
.hdr{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;
  padding:0 22px;height:58px;border-bottom:1px solid var(--line);
  background:rgba(7,13,20,.86);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:var(--ink);padding:0}
.brand svg{width:26px;height:26px;flex:none}
.brand .bt{font-family:var(--serif);font-size:16px;letter-spacing:.06em}
.brand .bs{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:2px}
.hdr-nav{display:flex;gap:7px;margin-left:auto;align-items:center}
.hdot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:transparent;
  color:var(--dim);font-family:var(--mono);font-size:11px;cursor:pointer;display:grid;place-items:center;transition:.18s}
.hdot:hover{border-color:var(--cyan);color:var(--cyan)}
.hdot.on{background:rgba(62,214,196,.12);border-color:var(--cyan);color:var(--cyan)}
.hdot.done{border-color:rgba(62,214,196,.5);color:var(--cyan)}
.hdot.done::after{content:"";position:absolute;margin-top:22px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.hdr-score{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em;margin-left:14px;
  padding-left:14px;border-left:1px solid var(--line)}
.hdr-score b{color:var(--amber);font-weight:500}

/* ============ 通用 ============ */
.wrap{max-width:1280px;margin:0 auto;padding:0 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);
  background:transparent;color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13.5px;cursor:pointer;
  transition:.16s;letter-spacing:.02em}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04120f;font-weight:500}
.btn.primary:hover{background:#5ce6d5;color:#04120f}
.btn.danger{border-color:rgba(242,99,111,.5);color:var(--red)}
.btn.danger:hover{background:rgba(242,99,111,.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;
  padding:4px 10px;font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}

/* ============ 首页 ============ */
.hero{min-height:calc(100vh - 58px);display:grid;grid-template-columns:1.08fr .92fr;align-items:center;
  gap:30px;max-width:1280px;margin:0 auto;padding:40px 32px 60px}
.hero-copy{max-width:600px}
.hero h1{font-family:var(--serif);font-size:clamp(46px,7vw,82px);line-height:1.02;margin:22px 0 0;
  letter-spacing:.02em;font-weight:700}
.hero h1 span{color:var(--cyan)}
.hero .lead{margin:24px 0 0;font-size:15.5px;line-height:1.95;color:var(--muted);max-width:520px}
.hero-actions{margin-top:34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-actions .hint{font-size:11px;color:var(--dim);letter-spacing:.08em}
.hero-stats{display:flex;gap:26px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.hero-stats div{font-family:var(--mono)}
.hero-stats b{display:block;font-size:22px;color:var(--ink);font-weight:500;letter-spacing:.02em}
.hero-stats span{font-size:10.5px;color:var(--dim);letter-spacing:.14em}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block}

/* ============ 章节地图 ============ */
.hub-head{padding:46px 0 26px}
.hub-head h2{font-family:var(--serif);font-size:32px;font-weight:600;margin:10px 0 8px;letter-spacing:.03em}
.hub-head p{color:var(--muted);font-size:14px;margin:0;max-width:640px;line-height:1.8}
.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:26px}
.chap-card{position:relative;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:20px 20px 18px;color:var(--ink);min-height:196px;display:flex;flex-direction:column;
  transition:.18s;overflow:hidden}
.chap-card:hover{border-color:rgba(62,214,196,.55);transform:translateY(-2px);background:var(--panel2)}
.chap-card .cc-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;color:var(--dim)}
.chap-card h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:16px 0 6px;line-height:1.45}
.chap-card .sub{font-size:12px;color:var(--cyan);letter-spacing:.04em}
.chap-card p{font-size:12.5px;line-height:1.75;color:var(--muted);margin:12px 0 0;flex:1}
.chap-card .cc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line)}
.play-tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim)}
.hub-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 0 60px;gap:16px;flex-wrap:wrap}
.hub-foot .note{font-size:12px;color:var(--dim);line-height:1.7}
.linkbtn{background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;padding:0}
.linkbtn:hover{color:var(--muted)}

/* ============ 章节页布局 ============ */
.chapter{display:grid;grid-template-columns:286px minmax(0,1fr);gap:18px;max-width:1280px;
  margin:0 auto;padding:22px 26px 54px;align-items:start}
.brief{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
.brief .panel{padding:16px 16px 14px}
.brief .ch-no{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--cyan)}
.brief h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:8px 0 4px;line-height:1.5}
.brief .ch-sub{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.brief p.task{font-size:12.5px;line-height:1.9;color:var(--muted);margin:12px 0 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);
  font-size:12px;color:var(--muted)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);color:var(--ink);font-weight:500}
.formula{font-family:var(--mono);font-size:12px;color:var(--amber);background:rgba(244,183,74,.06);
  border-left:2px solid rgba(244,183,74,.4);padding:8px 10px;margin:10px 0 0;line-height:1.7;border-radius:0 6px 6px 0}
.brief .tip{font-size:11.5px;line-height:1.8;color:var(--dim);margin:10px 0 0}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;min-width:0}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.stage-top .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
.stage-top .st b{color:var(--cyan);font-weight:500}
.stage svg{width:100%;height:auto;display:block;touch-action:none}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.ro{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.ro span{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;margin-top:4px;color:var(--ink)}
.ro b small{font-size:10px;color:var(--dim);font-weight:400;margin-left:2px}
.slider-row{display:grid;grid-template-columns:96px minmax(0,1fr) 88px;align-items:center;gap:10px;margin:11px 0}
.slider-row input[type=range]{width:100%;min-width:0}
.slider-row label{font-size:12px;color:var(--muted)}
.slider-row .val{font-family:var(--mono);font-size:12.5px;color:var(--amber);text-align:right;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--line2);
  border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--cyan);border:0;cursor:pointer;box-shadow:0 0 0 4px rgba(62,214,196,.14)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--cyan);
  border:0;cursor:pointer}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;line-height:1.85;color:var(--muted);min-height:44px}
.log .ok{color:var(--cyan)} .log .bad{color:var(--red)} .log .warn{color:var(--amber)}
.log .line{display:block}

/* ============ 结果弹层 ============ */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:rgba(4,8,12,.72);backdrop-filter:blur(8px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(560px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:28px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--cyan)}
.sheet h3{font-family:var(--serif);font-size:24px;margin:10px 0 2px;font-weight:600}
.sheet .score{display:flex;align-items:baseline;gap:12px;margin-top:14px}
.sheet .score b{font-family:var(--mono);font-size:40px;font-weight:500;color:var(--amber);line-height:1}
.sheet .score span{font-size:12px;color:var(--dim)}
.sheet ul{margin:14px 0 0;padding-left:0;list-style:none;font-size:12.5px;line-height:1.85;color:var(--muted)}
.sheet ul li{display:flex;gap:9px;margin:7px 0}
.sheet ul li i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-top:8px}
.kcard{margin-top:16px;border:1px dashed rgba(244,183,74,.45);border-radius:10px;padding:13px 15px;
  background:rgba(244,183,74,.04)}
.kcard .kt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.kcard p{margin:7px 0 0;font-size:12.5px;line-height:1.85;color:var(--muted)}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ============ 结业页 ============ */
.final-wrap{max-width:900px;margin:0 auto;padding:40px 26px;min-height:calc(100vh - 72px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.cert{border:1px solid var(--line2);border-radius:16px;padding:42px 44px;background:
  linear-gradient(160deg,rgba(62,214,196,.05),transparent 45%),var(--panel);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid rgba(62,214,196,.16);border-radius:10px;pointer-events:none}
.cert .eyebrow{color:var(--cyan)}
.cert h2{font-family:var(--serif);font-size:34px;margin:14px 0 6px}
.cert .sub{color:var(--muted);font-size:13px;line-height:1.9}
.cert .rows{margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cert .rows .ro b{font-size:26px}
.seal{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.seal .rank{font-family:var(--serif);font-size:26px;color:var(--amber)}

@media(max-width:1080px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){
  .asm-arrow{display:none}
  .asm-slot{flex:1 1 44%;min-width:0}
  .asm-card{flex:1 1 44%;min-width:0}
  #ch1Stage,#ch4Stage,#ch5Stage,#ch2Plot,#ch3Plot{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:2px}
  #ch1Stage>svg,#ch4Stage>svg,#ch5Stage>svg,#ch2Plot>svg,#ch3Plot>svg{min-width:600px;display:block}
}
@media(max-width:520px){
  .slider-row{grid-template-columns:80px minmax(0,1fr) 76px;gap:8px}
  .k-grid{grid-template-columns:1fr!important}
}
@media(max-width:900px){
  .chapter{grid-template-columns:1fr;padding:16px}
  .brief{position:static}
  .hero{grid-template-columns:1fr;padding:28px 20px 40px}
  .hero-art{max-width:440px;margin:0 auto;order:-1}
  .readout{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hub-grid{grid-template-columns:1fr}
  .cert{padding:30px 22px}
  .cert .rows{grid-template-columns:1fr}
  .hdr{padding:0 14px;gap:10px}
  .hdr-score{display:none}
  .hero h1{font-size:52px}
}
.asm-card{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;
  background:var(--panel2);cursor:pointer;transition:.16s;flex:1 1 132px;min-width:118px}
.asm-card:hover{border-color:var(--cyan);background:#16303f}
.asm-card b{font-size:13px;font-weight:500}
.asm-card span{font-size:10.5px;color:var(--dim);line-height:1.4}
.asm-slot{flex:1 1 120px;min-height:66px;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;transition:.25s;background:rgba(255,255,255,.015)}
.asm-slot.filled{border-style:solid;border-color:rgba(62,214,196,.5);background:rgba(62,214,196,.06)}
.asm-slot.live{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(62,214,196,.5) inset}
.asm-slot i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.asm-slot b{font-size:12.5px;font-weight:500;color:var(--ink)}
.asm-arrow{align-self:center;color:var(--line2);font-size:13px;padding:0 2px}
.lad-card{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;
  background:var(--panel2);cursor:pointer;transition:.16s;flex:1 1 200px;min-width:170px}
.lad-card:hover{border-color:var(--cyan);background:#16303f}
.lad-card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(62,214,196,.45) inset}
.lad-card b{font-size:12.5px;font-weight:500}
.lad-card span{font-size:10.5px;color:var(--dim);line-height:1.45}
.lad-slot{min-height:62px;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;display:flex;
  flex-direction:column;justify-content:center;gap:3px;transition:.2s;background:rgba(255,255,255,.015);cursor:pointer}
.lad-slot.on{border-style:solid;border-color:rgba(62,214,196,.5);background:rgba(62,214,196,.06);cursor:default}
.lad-slot.hot{border-color:var(--amber)}
.lad-slot i{font-style:normal;font-size:9.5px;color:var(--dim);font-family:var(--mono)}
.lad-slot b{font-size:12px;font-weight:500}
</style>
</head>
<body>
<header class="hdr">
  <button class="brand" id="brandBtn" aria-label="返回首页">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#2b4557" stroke-width="1"/>
      <path d="M18 5L9 18h5l-2 9 11-14h-6z" fill="#3ed6c4"/>
    </svg>
    <div>
      <div class="bt">电流防线</div>
      <div class="bs">RELAY PROTECTION LAB</div>
    </div>
  </button>
  <div class="hdr-nav" id="hdrNav"></div>
  <div class="hdr-score" id="hdrScore"></div>
</header>

<div id="app"></div>
<div id="modalHost"></div>

<script>
"use strict";

/* ============================================================
   数据与状态
   ============================================================ */
const CHAPTERS = [
  {id:1, key:"ch1", tag:"CH 01", name:"基本概念与要求", sub:"四性与选择性", title:"第一道防线",
   desc:"故障发生时，谁该跳、谁不该跳？先学会只切故障设备，再把保护装置装起来、把四项指标调到同一条线上。",
   play:"故障隔离 + 装置装配 + 四性整定"},
  {id:2, key:"ch2", tag:"CH 02", name:"阶段式电流保护", sub:"配合 · 整定", title:"时限的阶梯",
   desc:"电流速断、限时电流速断、定时限过电流三段接力。放好定值，再把三台保护排进各自的时刻。",
   play:"定值带 + 配合校验 + 时限阶梯 + 躲负荷"},
  {id:3, key:"ch3", tag:"CH 03", name:"距离保护", sub:"阻抗平面", title:"阻抗圆",
   desc:"不看电流大小，改看测量阻抗落在哪里。拖动动作特性圆扣住Ⅰ段，再给Ⅱ段补上末端空白。",
   play:"阻抗圆 + 故障检验 + Ⅱ段整定 + 特性选型"},
  {id:4, key:"ch4", tag:"CH 04", name:"输电线路纵联保护", sub:"两端信息", title:"两端会诊",
   desc:"线路两端同时看故障：方向一致才跳，一侧反方向就闭锁。通道中断时，你会怎么选？",
   play:"方向比对 + 差动判据 + 弱馈与 CT 断线 + 极性核对"},
  {id:5, key:"ch5", tag:"CH 05", name:"自动重合闸", sub:"时机与次数", title:"重合窗口",
   desc:"断路器跳开只是开始。抓住电弧熄灭后的那个窗口重合，还要记住什么时候不能再合。",
   play:"窗口节奏 + 选相 + 检同期 + 方式配置"},
  {id:6, key:"ch6", tag:"CH 06", name:"变压器与母线保护", sub:"差动 · 选择性", title:"差动与母线",
   desc:"变压器差动要躲过励磁涌流，母线保护要认准故障母线。整定两个旋钮，再决定拉掉哪几把开关。",
   play:"差动五工况 + 母线选择 + 平衡系数"}
];

const CHAPTER_MAP = {};
CHAPTERS.forEach(c => CHAPTER_MAP[c.id] = c);

const STORE_KEY = "relay-defense-progress-v1";
let store = {ch:{}};
function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.ch) store = o; }
  }catch(e){}
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function bestOf(id){ const r = store.ch[id]; return r || null; }
function completedCount(){ return CHAPTERS.filter(c => store.ch[c.id] && store.ch[c.id].done).length; }
function totalStars(){ return CHAPTERS.reduce((s,c)=> s + (store.ch[c.id] ? store.ch[c.id].stars : 0), 0); }

/* ============================================================
   通用工具
   ============================================================ */
const app = document.getElementById("app");
const modalHost = document.getElementById("modalHost");
let cleanup = null;
let timers = [];

function stopAll(){
  if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
  timers.forEach(t => clearTimeout(t));
  timers = [];
  document.querySelectorAll(".modal").forEach(m => m.remove());
}
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function raf(fn){
  let id = 0, dead = false;
  const loop = (t) => { if(dead) return; fn(t); id = requestAnimationFrame(loop); };
  id = requestAnimationFrame(loop);
  return () => { dead = true; cancelAnimationFrame(id); };
}
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function fmt(v,d){ return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }

const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.1-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>';
function starRow(n, size){
  size = size || 15;
  let out = '<span class="stars" style="display:inline-flex;gap:3px">';
  for(let i=0;i<3;i++){
    out += '<span style="width:'+size+'px;height:'+size+'px;display:inline-block;color:'+(i<n?'var(--amber)':'rgba(139,163,183,.28)')+'">'+STAR_SVG+'</span>';
  }
  return out + "</span>";
}

function updateHeader(active){
  const nav = document.getElementById("hdrNav");
  nav.innerHTML = CHAPTERS.map(c => {
    const done = store.ch[c.id] && store.ch[c.id].done;
    return '<button class="hdot'+(done?' done':'')+(active===c.id?' on':'')+'" data-go="'+c.key+'" title="'+esc(c.name)+'">'+c.id+'</button>';
  }).join("");

    '实训进度 <b>'+completedCount()+'/6</b> &nbsp;·&nbsp; 星章 <b>'+totalStars()+'/18</b>';

/* ============================================================
   路由
   ============================================================ */
const VIEWS = {};

function go(id){
  stopAll();
  const v = VIEWS[id];
  if(!v){ return; }
  app.innerHTML = v.html();
  const active = id.indexOf("ch")===0 ? Number(id.slice(2)) : 0;
  updateHeader(active);
  window.scrollTo({top:0, behavior:"instant"});
  if(v.init){ cleanup = v.init() || null; }
}

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if(g){
    const dest = g.getAttribute("data-go");
    go(dest);
  }
});
document.getElementById("brandBtn").addEventListener("click", () => go("home"));

/* ============================================================
   结算弹层
   ============================================================ */
function finish(chId, score, stars, bullets, cardText, nextId){
  score = Math.round(score);
  stars = clamp(stars, 0, 3);
  const prev = store.ch[chId];
  const rec = {
    done: true,
    score: prev ? Math.max(prev.score, score) : score,
    stars: prev ? Math.max(prev.stars, stars) : stars,
    card: cardText
  };
  store.ch[chId] = rec;
  saveStore();
  updateHeader(chId);

  const ch = CHAPTER_MAP[chId];
  const next = nextId || (chId < 6 ? "ch"+(chId+1) : "final");
  const rank = stars===3 ? "优秀" : stars===2 ? "合格" : "勉强过关";
  const sheet = document.createElement("div");
  sheet.className = "modal";
  sheet.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sh-tag">CHAPTER ${chId<10?"0"+chId:chId} · 结算</div>
      <h3>${esc(ch.title)}</h3>
      <div class="score">
        ${starRow(stars, 20)}
        <b>${score}</b><span>/ 100 · ${rank}</span>
      </div>
      <ul>${bullets.map(b=>'<li><i></i><span>'+b+'</span></li>').join("")}</ul>
      <div class="kcard">
        <div class="kt">知识卡 · ${esc(ch.sub)}</div>
        <p>${cardText}</p>
      </div>
      <div class="acts">
        <button class="btn sm" data-retry>重新推演</button>
        <button class="btn primary sm" data-next>${chId<6?"进入下一章":"查看结业档案"}</button>
      </div>
    </div>`;
  modalHost.appendChild(sheet);
  sheet.querySelector("[data-retry]").addEventListener("click", () => { sheet.remove(); go("ch"+chId); });
  sheet.querySelector("[data-next]").addEventListener("click", () => { sheet.remove(); go(next); });
}

      svg += '<g>';
      svg += '<circle cx="'+f.x+'" cy="'+f.y+'" r="17" fill="rgba(242,99,111,.10)" stroke="rgba(242,99,111,.6)" stroke-width="1"/>';
      svg += '<path d="M'+(f.x-7)+' '+(f.y-12)+'L'+(f.x-1)+' '+(f.y-2)+'L'+(f.x-6)+' '+(f.y+2)+'L'+(f.x+2)+' '+(f.y+12)+'" stroke="#f2636f" stroke-width="2.2" fill="none" stroke-linejoin="miter"/>';
      svg += '</g>';
      svg += nodeLabel("故障点 · "+f.name, 380, 322, "#f2636f", 10);

      svg += '</svg>';
      return svg;
    }

    function renderIsolation(){
      phaseTag.innerHTML = '阶段 <b>1</b> / 4 · 故障隔离';
      roundTag.textContent = "故障 " + (round+1) + " / 3";
      stage.innerHTML = renderNet();
      const e = energy();
      const f = faults[round];
      const opened = Object.keys(qf).filter(function(k){ return qf[k]; });
      readout.innerHTML =
        '<div class="ro"><span>已断开开关</span><b style="font-size:14px">'+(opened.length?opened.join(" / "):"无")+'</b></div>'+
        '<div class="ro"><span>失电负荷</span><b>'+(3 - ((e.A?1:0)+(e.B?1:0)+(e.C?1:0)))+'<small>个</small></b></div>'+
        '<div class="ro"><span>故障状态</span><b style="font-size:13px;color:'+(faultCleared(f)?"var(--cyan)":"var(--red)")+'">'+(faultCleared(f)?"已隔离":"仍在供电")+'</b></div>'+
        '<div class="ro"><span>本阶段得分</span><b>'+scores.reduce(function(a,b){return a+b;},0)+'<small>/30</small></b></div>';

      if(acted){
        ctrl.innerHTML = '<button class="btn primary" id="ch1Next">'+(round<2?"下一处故障":"进入装配阶段")+'</button>'+
          '<button class="btn" id="ch1Retry">重做本故障</button>';
        document.getElementById("ch1Next").addEventListener("click", function(){
          if(round<2){ round++; qf={QF0:false,QF1:false,QF2:false,QF3:false,QF4:false}; acted=false;
            log.innerHTML = "新故障出现。点击断路器断开，注意别让上游负荷陪停。"; renderIsolation(); }
          else { phase=2; startAssembly(); }
        });
        document.getElementById("ch1Retry").addEventListener("click", function(){
          qf={QF0:false,QF1:false,QF2:false,QF3:false,QF4:false}; acted=false;
          log.innerHTML = "已恢复全部开关。重新选择要断开的断路器，本轮只保留最高一次得分。";
          renderIsolation();
        });
      } else {
        ctrl.innerHTML = '<button class="btn primary" id="ch1Exec">执行隔离</button>'+
          '<button class="btn" id="ch1OpenAll">全部合上</button>';
        document.getElementById("ch1Exec").addEventListener("click", execute);
        document.getElementById("ch1OpenAll").addEventListener("click", function(){
          qf={QF0:false,QF1:false,QF2:false,QF3:false,QF4:false}; renderIsolation();
        });
      }
    }

    stage.addEventListener("click", function(e){
      const g = e.target.closest("[data-qf]");
      if(!g || acted) return;
      const id = g.getAttribute("data-qf");
      qf[id] = !qf[id];
      renderIsolation();
    });

    function execute(){
      const f = faults[round];
      const cleared = faultCleared(f);
      const out = outage(f);
      const opened = Object.keys(qf).filter(function(k){ return qf[k]; });
      let sc = 0;
      let msg = "";
      if(cleared && out <= f.best){
        sc = 10;
        msg = '<span class="ok">选择性正确。</span> 故障设备已脱离电源，非故障负荷全部保住。';
      } else if(cleared && out > f.best){
        sc = 7;
        msg = '<span class="warn">故障切除了，但停电范围过大。</span> 你多断开了上级开关，让 '+(out-f.best)+' 个不该停的负荷陪停，选择性不合格。';
      } else {
        sc = 0;
        msg = '<span class="bad">故障仍与电源相连。</span> 故障线路没有被隔离，保护等于拒动，短路电流会继续烧设备、拖垮上级。';
      }
      scores[round] = Math.max(scores[round], sc);
      acted = true;
      log.innerHTML = msg + '<span class="line" style="color:var(--dim)">断开：'+(opened.length?opened.join(" / "):"无")+
        ' · 失电负荷 '+out+' 个 · 本轮得分 '+sc+'/10</span>';
      renderIsolation();
    }

    /* ---------- 阶段二：保护装置装配 ---------- */
    const ASM_PARTS = [
      {id:"meas", n:"测量元件", d:"采集电流、电压"},
      {id:"cmp",  n:"比较元件", d:"与整定值比较"},
      {id:"delay",n:"延时元件", d:"按时限 t 出口"},
      {id:"out",  n:"出口元件", d:"动作于跳闸与信号"}
    ];

    function startAssembly(){
      phaseTag.innerHTML = '阶段 <b>2</b> / 4 · 保护装置装配';
      roundTag.textContent = '按信号流把四个环节装进机箱';
      asmPicked = []; asmMistakes = 0; asmDone = false; asmScore = 0;
      asmTray = ASM_PARTS.slice().sort(function(){ return Math.random() - 0.5; }).map(function(p){ return p.id; });
      ctrl.innerHTML = '';
      renderAsm();
      log.innerHTML = '一套保护装置由四个环节串成：先测到什么，再拿去和谁比，等多久，最后动什么。按信号流的先后点击零件，把它装进机箱。';
    }

    function asmSlotsHtml(){
      let h = '';
      ASM_PARTS.forEach(function(p,i){
        const got = asmPicked[i];
        h += '<div class="asm-slot'+(got?' filled':'')+'" id="ch1Slot'+i+'">'+
          '<i>环节 '+["①","②","③","④"][i]+'</i>'+
          '<b>'+(got?p.n:'— 待装 —')+'</b></div>';
        if(i<3) h += '<div class="asm-arrow">→</div>';
      });
      return h;
    }

    function asmTrayHtml(){
      const left = asmTray.filter(function(id){ return asmPicked.indexOf(id) < 0; });
      if(!left.length) return '<div style="font-size:12px;color:var(--dim);padding:10px 0">零件已经全部装进机箱。</div>';
      return left.map(function(id){
        const p = ASM_PARTS.filter(function(x){ return x.id === id; })[0];
        return '<div class="asm-card" data-part="'+p.id+'"><b>'+p.n+'</b><span>'+p.d+'</span></div>';
      }).join('');
    }

    function renderAsm(){
      stage.innerHTML =
        '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em;margin-bottom:7px">待装零件 · 点一下放入下一个环节</div>'+
        '<div id="ch1Tray" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">'+asmTrayHtml()+'</div>'+
        '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em;margin-bottom:7px">保护装置机箱 · 信号流方向</div>'+
        '<div id="ch1Slots" style="display:flex;gap:6px;flex-wrap:wrap;align-items:stretch">'+asmSlotsHtml()+'</div>'+
        '<div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:20px;flex-wrap:wrap">'+
          '<div style="flex:1 1 190px;min-width:170px;font-size:11.5px;line-height:1.75;color:var(--muted)"><b style="color:var(--ink);font-weight:500;display:block;margin-bottom:3px">① 测量在前</b>没有电流、电压的采样值，后面的环节全都没有输入，谈不到判断。</div>'+
          '<div style="flex:1 1 190px;min-width:170px;font-size:11.5px;line-height:1.75;color:var(--muted)"><b style="color:var(--ink);font-weight:500;display:block;margin-bottom:3px">② 比较决定要不要动</b>把量值和整定值放在一起比，才知道是越限还是正常负荷。</div>'+
          '<div style="flex:1 1 190px;min-width:170px;font-size:11.5px;line-height:1.75;color:var(--muted)"><b style="color:var(--ink);font-weight:500;display:block;margin-bottom:3px">③ 延时决定什么时候动</b>越限不是立刻出口，级差靠延时实现，选择性就长在这里。</div>'+
          '<div style="flex:1 1 190px;min-width:170px;font-size:11.5px;line-height:1.75;color:var(--muted)"><b style="color:var(--ink);font-weight:500;display:block;margin-bottom:3px">④ 出口最后</b>只有它真正动断路器，动作不可逆，所以放在链路末端。</div>'+
        '</div>';
      readout.innerHTML =
        '<div class="ro"><span>已装环节</span><b>'+asmPicked.length+'<small>/4</small></b></div>'+
        '<div class="ro"><span>装错次数</span><b style="color:'+(asmMistakes?'var(--amber)':'var(--cyan)')+'">'+asmMistakes+'</b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+asmScore+'<small>/20</small></b></div>'+
        '<div class="ro"><span>装配状态</span><b style="font-size:13px;color:'+(asmDone?'var(--cyan)':'var(--muted)')+'">'+(asmDone?"校验通过":"装配中")+'</b></div>';
    }

    function pickPart(id){
      const need = ASM_PARTS[asmPicked.length];
      const p = ASM_PARTS.filter(function(x){ return x.id === id; })[0];
      if(id !== need.id){
        asmMistakes++;
        log.innerHTML = '<span class="bad">顺序不对，装不进去。</span>「'+p.n+'」此刻没有输入信号——信号链上还缺「'+need.n+'」。'+
          '<span class="line" style="color:var(--dim)">信号流只能是 测量 → 比较 → 延时 → 出口。装错 '+asmMistakes+' 次（每次扣 2 分，最低保底 10 分）</span>';
        renderAsm();
        return;
      }
      asmPicked.push(id);
      log.innerHTML = '<span class="ok">装上了「'+need.n+'」。</span> 它的职责：'+need.d+'。';
      renderAsm();
      if(asmPicked.length === 4) completeAssembly();
    }

    function completeAssembly(){
      asmDone = true;
      asmScore = Math.max(10, 20 - asmMistakes * 2);
      renderAsm();
      ASM_PARTS.forEach(function(p,i){
        later(function(){
          const el = document.getElementById("ch1Slot"+i);
          if(el) el.classList.add("live");
        }, 200 + i*220);
      });
      later(function(){
        log.innerHTML = '<span class="ok">校验通过，装置一次走通。</span> 故障电流 3.2 kA → 测量元件得到 3.2 kA → 比较元件判断越限（定值 1.8 kA）→ 延时元件守住 0.5 s 级差 → 出口元件跳闸。'+
          '<span class="line" style="color:var(--dim)">本关得分 '+asmScore+' / 20'+(asmMistakes?' · 装错 '+asmMistakes+' 次':' · 一次装对，满格')+'</span>';
      }, 1180);
      ctrl.innerHTML = '<button class="btn" id="ch1AsmRetry">重新装配</button>'+
        '<button class="btn primary" id="ch1ToTune">进入体检阶段</button>';
      document.getElementById("ch1AsmRetry").addEventListener("click", startAssembly);
      document.getElementById("ch1ToTune").addEventListener("click", function(){ phase = 3; startCheckup(); });
    }

    stage.addEventListener("click", function(e){
      const card = e.target.closest("[data-part]");
      if(!card || asmDone) return;
      pickPart(card.getAttribute("data-part"));
    });

    /* ---------- 阶段三：装置体检 ---------- */
    const CHK_PARTS = [
      {id:"ta",  n:"TA 二次回路", d:"电流采样通路", bad:"TA 二次端子松动，采样电流间歇性跌落，重故障时灵敏度不够、可能拒动"},
      {id:"dc",  n:"直流电源插件", d:"装置工作电源", bad:"电源纹波超标，出口继电器抖动，可能无故障就误动"},
      {id:"set", n:"定值拨轮",     d:"与整定单核对", bad:"拨轮还停在旧定值单，Ⅰ段定值比整定单低 12%，区外故障会越界抢跳"}
    ];

    function startCheckup(){
      phaseTag.innerHTML = '阶段 <b>3</b> / 4 · 装置体检';
      roundTag.textContent = '投运前自检 · 三块插件';
      chkChecked = {}; chkBad = ""; chkScore = 0; chkDone = false;
      chkBad = CHK_PARTS[Math.floor(Math.random()*CHK_PARTS.length)].id;
      renderCheckup();
      log.innerHTML = '装置装好了，投运前还要做一次例行体检：三块插件逐个点开看自检结果。发现异常就闭锁并告警，等检修处理——带病投运，比不投运更危险。';
    }

    function renderCheckup(){
      const n = Object.keys(chkChecked).length;
      const found = !!chkChecked[chkBad];
      stage.innerHTML =
        '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em;margin-bottom:7px">装置面板 · 点插件查看自检结果</div>'+
        '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
          CHK_PARTS.map(function(p){
            const got = chkChecked[p.id];
            const isBad = got && p.id === chkBad;
            return '<div class="asm-card" data-chk="'+p.id+'" style="flex:1 1 190px;min-width:0;cursor:pointer;'+
              (got ? 'border-color:'+(isBad?"rgba(242,99,111,.55)":"rgba(62,214,196,.4)")+';' : '')+'">'+
              '<b>'+p.n+'</b><span>'+p.d+'</span>'+
              '<div style="margin-top:8px;font-size:10px;font-family:var(--mono);letter-spacing:.08em;color:'+
                (!got ? "var(--dim)" : isBad ? "var(--red)" : "var(--cyan)")+'">'+
                (!got ? "· 未检查" : isBad ? "✕ 自检异常" : "✓ 正常")+'</div>'+
            '</div>';
          }).join("")+
        '</div>'+
        '<div style="margin-top:18px;padding:12px 14px;border-left:2px solid '+(found?"rgba(242,99,111,.6)":"rgba(62,214,196,.45)")+';background:rgba(255,255,255,.02);font-size:12px;line-height:1.75">'+
          (found ? '体检结论：'+CHK_PARTS.filter(function(x){return x.id===chkBad;})[0].bad+'。装置不能带病投运，应闭锁出口并发告警信号，通知检修处理。'
                 : n ? '已检 '+n+' / 3 块，暂未发现问题。继续把剩下的插件看完，再决定投不投。'
                     : '点击一块插件开始体检。')+
        '</div>'+
        '<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;line-height:1.8;color:var(--muted)">'+
          '<b style="color:var(--ink);font-weight:500">为什么要闭锁而不是"先投着看看"</b>：保护装置有两种失效方向——拒动会把故障留给上级甚至烧设备，误动会把正常线路切掉。自检异常说明装置已经不可信，闭锁并告警是唯一正确的处置。'+
        '</div>';
      readout.innerHTML =
        '<div class="ro"><span>已检插件</span><b>'+n+'<small>/3</small></b></div>'+
        '<div class="ro"><span>异常定位</span><b style="font-size:13px;color:'+(found?'var(--red)':'var(--muted)')+'">'+(found?"已发现":"未发现")+'</b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+chkScore+'<small>/20</small></b></div>'+
        '<div class="ro"><span>装置状态</span><b style="font-size:13px">'+(chkDone?(chkScore>=20?"已闭锁":"已处置"):"待体检")+'</b></div>';
      if(!chkDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch1ChkBlock">闭锁并告警</button>'+
          '<button class="btn" id="ch1ChkRun">直接投入运行</button>';
        document.getElementById("ch1ChkBlock").addEventListener("click", function(){ chkDecide("block"); });
        document.getElementById("ch1ChkRun").addEventListener("click", function(){ chkDecide("run"); });
      } else {
        ctrl.innerHTML = '<button class="btn" id="ch1ChkRetry">重新体检</button>'+
          '<button class="btn primary" id="ch1ToTune">进入整定阶段</button>';
        document.getElementById("ch1ChkRetry").addEventListener("click", startCheckup);
        document.getElementById("ch1ToTune").addEventListener("click", function(){ phase = 4; startTune(); });
      }
    }

    function chkDecide(kind){
      if(chkDone) return;
      const n = Object.keys(chkChecked).length;
      const base = n * 4;
      chkDone = true;
      if(kind === "run"){
        chkScore = base;
        log.innerHTML = '<span class="bad">带病投运。</span> 装置的自检异常没有处理就投入运行：拒动时故障会继续烧设备，误动时正常线路被无谓切掉，还收不到告警。'+
          '<span class="line" style="color:var(--dim)">检查得分 '+base+' / 12，处置得分 0 / 8 · 合计 '+chkScore+'/20</span>';
        renderCheckup();
        return;
      }
      if(n < 3){
        chkScore = base;
        log.innerHTML = '<span class="warn">闭锁了，但没查完。</span> 只看了 '+n+' / 3 块插件就闭锁：装置退出运行，运维却不知道坏在哪，只能整台返厂。'+
          '<span class="line" style="color:var(--dim)">检查得分 '+base+' / 12，处置得分 0 / 8 · 合计 '+chkScore+'/20</span>';
        renderCheckup();
        return;
      }
      chkScore = 12 + 8;
      log.innerHTML = '<span class="ok">处置正确。</span> 三块插件全部查完，异常定位到「'+CHK_PARTS.filter(function(x){return x.id===chkBad;})[0].n+'」，闭锁出口并发告警，等检修处理。装置不带病、也不误动。'+
        '<span class="line" style="color:var(--dim)">检查得分 12 / 12，处置得分 8 / 8 · 合计 20/20</span>';
      renderCheckup();
    }

    stage.addEventListener("click", function(e){
      const card = e.target.closest("[data-chk]");
      if(!card || chkDone) return;
      const id = card.getAttribute("data-chk");
      if(chkChecked[id]) return;
      chkChecked[id] = true;
      const p = CHK_PARTS.filter(function(x){ return x.id===id; })[0];
      if(id === chkBad){
        log.innerHTML = '<span class="bad">发现异常：'+p.n+'。</span> '+p.bad+'。继续检查剩余的插件，确认没有别的问题，再决定处置方式。';
      } else {
        log.innerHTML = '<span class="ok">'+p.n+' 自检正常。</span> '+p.d+'无异常。还剩 '+(3-Object.keys(chkChecked).length)+' 块待查。';
      }
      renderCheckup();
    });

    /* ---------- 阶段四：四性整定台 ---------- */
    function tuneGauges(){
      const x = clamp((tune.k - 1) / 0.8, 0, 1);
      const y = clamp((tune.t - 0.1) / 1.1, 0, 1);
      return [
        {n:"灵敏性", v:50 + 50*x, d:"K_sen 决定保护范围，越大越能反应远处故障"},
        {n:"选择性", v:96 - 30*x, d:"灵敏度过高会伸进相邻线路，造成越界误动"},
        {n:"速动性", v:98 - 40*y, d:"时限越长，切除故障越慢，设备损伤越大"},
        {n:"可靠性", v:60 + 40*y, d:"适当的时限和裕度，能避开暂态误动"}
      ];
    }
    function gaugeHtml(){
      return tuneGauges().map(function(g){
        const pass = g.v >= 75;
        const col = pass ? "#3ed6c4" : g.v >= 65 ? "#f4b74a" : "#f2636f";
        return '<div style="margin:11px 0">'+
          '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)"><span>'+g.n+'</span>'+
          '<span class="mono" style="color:'+col+'">'+g.v.toFixed(0)+'</span></div>'+
          '<div style="height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden;position:relative">'+
            '<div style="position:absolute;left:75%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)"></div>'+
            '<div style="height:100%;width:'+g.v+'%;background:'+col+';transition:width .15s"></div>'+
          '</div>'+
          '<div style="font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5">'+g.d+'</div>'+
        '</div>';
      }).join("");
    }
    function tuneSvg(){
      const reach = 60 + 25*clamp((tune.k-1)/0.8, 0, 1);
      const x1 = 70, x2 = 470, len = x2 - x1;
      const end = x1 + len * reach / 100;
      return '<svg viewBox="0 0 520 200" role="img" aria-label="保护范围示意">'+
        '<line x1="'+x1+'" y1="100" x2="'+x2+'" y2="100" stroke="#2e4a5e" stroke-width="2"/>'+
        '<rect x="'+x1+'" y="78" width="'+Math.max(0,end-x1)+'" height="44" fill="rgba(62,214,196,.10)" stroke="rgba(62,214,196,.35)" stroke-width="1"/>'+
        '<rect x="'+(x1-13)+'" y="85" width="26" height="30" rx="3" fill="rgba(110,168,255,.14)" stroke="#6ea8ff" stroke-width="1.2"/>'+
        '<text x="'+x1+'" y="132" text-anchor="middle" font-size="9.5" fill="#6ea8ff" font-family="ui-monospace,Menlo,monospace">R</text>'+
        '<line x1="'+end+'" y1="70" x2="'+end+'" y2="130" stroke="#3ed6c4" stroke-width="1.2" stroke-dasharray="4 3"/>'+
        '<text x="'+end+'" y="62" text-anchor="middle" font-size="10" fill="#3ed6c4" font-family="ui-monospace,Menlo,monospace">'+reach.toFixed(0)+'%</text>'+
        '<circle cx="'+(x1+len*0.7)+'" cy="100" r="7" fill="rgba(242,99,111,.14)" stroke="#f2636f" stroke-width="1"/>'+
        '<text x="'+(x1+len*0.7)+'" y="152" text-anchor="middle" font-size="9.5" fill="#f2636f" font-family="ui-monospace,Menlo,monospace">70% 故障点</text>'+
        '<text x="'+x2+'" y="132" text-anchor="middle" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">线路末端</text>'+
        '</svg>';
    }

    function syncTune(){
      document.getElementById("ch1Gauges").innerHTML = gaugeHtml();
      document.getElementById("ch1ZoneBox").innerHTML = tuneSvg();
      document.getElementById("ch1KVal").textContent = "K_sen = " + tune.k.toFixed(2);
      document.getElementById("ch1TVal").textContent = "t = " + tune.t.toFixed(2) + " s";
      refreshTuneReadout();
    }

    function startTune(){
      phaseTag.innerHTML = '阶段 <b>4</b> / 4 · 四性整定台';
      roundTag.textContent = "目标：四项指标全部 ≥ 75";
      stage.innerHTML =
        '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">'+
          '<div style="flex:1 1 330px;min-width:0">'+
            '<div id="ch1ZoneBox"></div>'+
            '<div class="slider-row"><label>灵敏系数 K<sub>sen</sub></label><input type="range" id="ch1K" min="1" max="1.8" step="0.02" value="'+tune.k+'"><span class="val" id="ch1KVal"></span></div>'+
            '<div class="slider-row"><label>动作时限 t</label><input type="range" id="ch1T" min="0.1" max="1.2" step="0.02" value="'+tune.t+'"><span class="val" id="ch1TVal"></span></div>'+
            '<p class="tip" style="margin-top:6px">范围环表示当前整定下的保护范围。左侧故障点始终在 70% 处：范围够长才看得见它，但伸得太远就会跨进相邻线路。</p>'+
          '</div>'+
          '<div style="flex:1 1 240px;min-width:220px" id="ch1Gauges"></div>'+
        '</div>';
      document.getElementById("ch1K").addEventListener("input", function(e){ tune.k = Number(e.target.value); syncTune(); });
      document.getElementById("ch1T").addEventListener("input", function(e){ tune.t = Number(e.target.value); syncTune(); });
      syncTune();
      ctrl.innerHTML = '<button class="btn primary" id="ch1Run">投入试运行</button>';
      document.getElementById("ch1Run").addEventListener("click", runTune);
      log.innerHTML = "拖动两根滑杆：灵敏性与选择性、速动性与可靠性分别是一对跷跷板。让四条亮条同时越过 75 的刻度线。";
      readout.innerHTML =
        '<div class="ro"><span>灵敏性</span><b id="ch1R1">—</b></div>'+
        '<div class="ro"><span>选择性</span><b id="ch1R2">—</b></div>'+
        '<div class="ro"><span>速动性</span><b id="ch1R3">—</b></div>'+
        '<div class="ro"><span>可靠性</span><b id="ch1R4">—</b></div>';
      refreshTuneReadout();
    }

    function refreshTuneReadout(){
      tuneGauges().forEach(function(g,i){
        const el = document.getElementById("ch1R"+(i+1));
        if(el){ el.textContent = g.v.toFixed(0); el.style.color = g.v>=75 ? "var(--cyan)" : "var(--amber)"; }
      });
    }

    function runTune(){
      const gs = tuneGauges();
      const passed = gs.filter(function(g){ return g.v >= 75; }).length;
      const score = passed * 7 + (passed === 4 ? 2 : 0);
      tuneBest = Math.max(tuneBest, score);
      const zone = 60 + 25*clamp((tune.k-1)/0.8, 0, 1);
      let lines = [];
      if(gs[0].v < 75) lines.push('<span class="bad">灵敏性不足：</span>70% 处故障在保护范围外，保护看不见，只能等后备。');
      if(gs[1].v < 75) lines.push('<span class="bad">选择性不足：</span>保护范围伸进相邻线路，区外故障也会跳闸。');
      if(gs[2].v < 75) lines.push('<span class="bad">速动性不足：</span>动作太慢，短路电流持续时间内设备已经开始受伤。');
      if(gs[3].v < 75) lines.push('<span class="bad">可靠性不足：</span>裕度不够，暂态过程或测量误差就可能引起误动。');
      if(passed === 4) lines.push('<span class="ok">四项全部合格。</span> 保护范围 '+zone.toFixed(0)+'%，动作时间 '+tune.t.toFixed(2)+' s —— 这是一个可交付的折中方案。');
      log.innerHTML = lines.join('<span class="line"></span>') +
        '<span class="line" style="color:var(--dim)">本阶段得分 '+score+'/30'+(tuneDone?' · 已记录最高分 '+tuneBest+'/30':'')+'</span>';
      readout.innerHTML =
        '<div class="ro"><span>整定结果</span><b style="font-size:13px;color:'+(passed===4?"var(--cyan)":"var(--amber)")+'">'+(passed===4?"四性合格":passed+" / 4 合格")+'</b></div>'+
        '<div class="ro"><span>保护范围</span><b>'+zone.toFixed(0)+'<small>%</small></b></div>'+
        '<div class="ro"><span>灵敏系数</span><b>'+tune.k.toFixed(2)+'</b></div>'+
        '<div class="ro"><span>动作时限</span><b>'+tune.t.toFixed(2)+'<small>s</small></b></div>';

      tuneDone = true;
      ctrl.innerHTML = '<button class="btn" id="ch1Again">再调一次</button>'+
        '<button class="btn primary" id="ch1End">提交整定方案</button>';
      document.getElementById("ch1Again").addEventListener("click", function(){
        startTune();
      });
      document.getElementById("ch1End").addEventListener("click", function(){
        const total = scores.reduce(function(a,b){return a+b;},0) + asmScore + chkScore + tuneBest;
        const st = total >= 85 ? 3 : total >= 65 ? 2 : 1;
        finish(1, total, st, [
          "选择性：只断开故障设备两侧的开关。母线 B 故障时，必须把母线 B 从电源侧和负荷侧同时隔离。",
          "四性不是四个独立指标：K_sen 抬高会改善灵敏性、恶化选择性；时限放长会改善可靠性、恶化速动性。",
          tuneBest>=30 ? "本次整定四性全部达标，方案可以投入。" : "本次只有 "+(tuneBest>=30?4:tuneBest>=23?3:tuneBest>=16?2:tuneBest>=9?1:0)+" 项达标，实际工程中需要重新折中甚至更换保护方案。"
        ], "继电保护的四个基本要求：可靠性（不拒动、不误动）、选择性（只切故障设备，停电范围最小）、灵敏性（K_sen = 保护范围末端最小短路电流 / 整定值，一般要求 1.2~1.5）、速动性（尽快切除故障）。四者相互制约，整定就是寻找它们的交集。");
      });
    }

    renderIsolation();
    return function(){};
  }
};

VIEWS.ch2 = {
  html(){
    return `
    <div class="chapter">

          <p class="tip">短路电流随故障点变远而减小。定值线画得越低，保护伸得越远——但伸过本线路末端，就会和下级抢着跳闸。</p>

      </main>
    </div>`;
  },
  init(){
    const P = {x0:66, x1:700, y0:46, y1:296, dmax:2.2, imax:5.6};
    const vl = {I:2.35, II:1.75, III:0.95};
    const bands = {
      I:{lo:3.36, hi:3.571, col:"#f4b74a", name:"Ⅰ段整定带", note:"70%~85% 覆盖"},
      II:{lo:2.10, hi:2.39, col:"#6ea8ff", name:"Ⅱ段整定带", note:"保护全长且与下级配合"},
      III:{lo:1.20, hi:1.795, col:"#3ed6c4", name:"Ⅲ段整定带", note:"躲负荷，兼作后备"}
    };
    let runDone = false;
    let dragKey = null;
    let baseScore = 0;

    const plot = document.getElementById("ch2Plot");
    const readout = document.getElementById("ch2Readout");
    const ctrl = document.getElementById("ch2Ctrl");
    const log = document.getElementById("ch2Log");
    const tag = document.getElementById("ch2Tag");

    const xToPx = d => P.x0 + d / P.dmax * (P.x1 - P.x0);
    const yToPx = i => P.y1 - i / P.imax * (P.y1 - P.y0);
    const pxToI = py => (P.y1 - py) / (P.y1 - P.y0) * P.imax;
    const curve = d => 5.6 / (1 + 0.8 * d);
    const coverI = i => clamp((5.6 / i - 1) / 0.8, 0, 2.4);

    function plotSvg(){
      let s = '<svg viewBox="0 0 860 380" id="ch2Svg" role="img" aria-label="电流距离曲线与定值带">'+SVG_DEFS;
      // 网格
      s += '<g stroke="#16242f" stroke-width="1">';
      for(let i=0;i<=5;i++){ const y = yToPx(i); s += '<line x1="'+P.x0+'" y1="'+y+'" x2="'+P.x1+'" y2="'+y+'"/>'; }
      for(let d=0; d<=P.dmax; d+=0.2){ const x = xToPx(d); s += '<line x1="'+x+'" y1="'+P.y0+'" x2="'+x+'" y2="'+P.y1+'"/>'; }
      s += '</g>';
      // 坐标轴
      s += '<line x1="'+P.x0+'" y1="'+P.y1+'" x2="'+P.x1+'" y2="'+P.y1+'" stroke="#2b4557" stroke-width="1.2"/>';
      s += '<line x1="'+P.x0+'" y1="'+P.y0+'" x2="'+P.x0+'" y2="'+P.y1+'" stroke="#2b4557" stroke-width="1.2"/>';
      for(let i=1;i<=5;i++){ s += '<text x="'+(P.x0-10)+'" y="'+(yToPx(i)+4)+'" text-anchor="end" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+i+'</text>'; }
      s += '<text x="18" y="'+(P.y0-18)+'" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">I / kA</text>';
      // 距离刻度
      [[0,"A"],[1,"B"],[2,"C"]].forEach(function(b){
        const x = xToPx(b[0]);
        s += '<line x1="'+x+'" y1="'+P.y0+'" x2="'+x+'" y2="'+P.y1+'" stroke="#2b4557" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>';
        s += '<text x="'+x+'" y="'+(P.y1+16)+'" text-anchor="middle" font-size="10" fill="#8ba3b7" font-family="ui-monospace,Menlo,monospace">'+b[1]+'</text>';
        s += '<text x="'+x+'" y="'+(P.y1+30)+'" text-anchor="middle" font-size="9" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+b[0].toFixed(1)+'</text>';
      });
      s += '<text x="16" y="'+(P.y1+46)+'" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">故障点距离（标幺）</text>';
      // 整定带
      Object.keys(bands).forEach(function(k){
        const b = bands[k];
        s += '<rect x="'+P.x0+'" y="'+yToPx(b.hi)+'" width="'+(P.x1-P.x0)+'" height="'+(yToPx(b.lo)-yToPx(b.hi))+'" fill="'+b.col+'" opacity=".07"/>';
        s += '<line x1="'+P.x0+'" y1="'+yToPx(b.hi)+'" x2="'+P.x1+'" y2="'+yToPx(b.hi)+'" stroke="'+b.col+'" stroke-width="1" opacity=".35" stroke-dasharray="5 4"/>';
        s += '<line x1="'+P.x0+'" y1="'+yToPx(b.lo)+'" x2="'+P.x1+'" y2="'+yToPx(b.lo)+'" stroke="'+b.col+'" stroke-width="1" opacity=".35" stroke-dasharray="5 4"/>';
      });
      // 曲线
      let pts = [];
      for(let d=0; d<=2.2; d+=0.02){ pts.push(xToPx(d).toFixed(1)+","+yToPx(curve(d)).toFixed(1)); }
      s += '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#dbe6f0" stroke-width="2" opacity=".85"/>';
      s += '<text x="'+(xToPx(0.28))+'" y="'+(yToPx(curve(0.28))-10)+'" font-size="9.5" fill="#dbe6f0" font-family="ui-monospace,Menlo,monospace" opacity=".8">I_k(d)</text>';
      // 负荷线
      s += '<line x1="'+P.x0+'" y1="'+yToPx(1.0)+'" x2="'+P.x1+'" y2="'+yToPx(1.0)+'" stroke="#a99cf5" stroke-width="1" stroke-dasharray="6 4" opacity=".7"/>';
      s += '<text x="'+(P.x0+8)+'" y="'+(yToPx(1.0)+13)+'" font-size="9" fill="#a99cf5" font-family="ui-monospace,Menlo,monospace" opacity=".8">最大负荷 1.0 kA</text>';
      // 定值线
      ["I","II","III"].forEach(function(k){
        const b = bands[k];
        const v = vl[k];
        const y = yToPx(v);
        const ok = v >= b.lo && v <= b.hi;
        const col = ok ? "#3ed6c4" : b.col;
        s += '<g data-line="'+k+'" style="cursor:ns-resize">';
        s += '<rect x="'+P.x0+'" y="'+(y-11)+'" width="'+(P.x1-P.x0)+'" height="22" fill="transparent"/>';
        s += '<line x1="'+P.x0+'" y1="'+y+'" x2="'+P.x1+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+(ok?2.3:1.8)+'" opacity="'+(ok?1:.9)+'"/>';
        s += '<circle cx="'+P.x1+'" cy="'+y+'" r="6" fill="'+col+'" opacity=".9"/>';
        s += '<text x="'+(P.x1+10)+'" y="'+(y+4)+'" font-size="10.5" fill="'+col+'" font-family="ui-monospace,Menlo,monospace">'+k+' '+v.toFixed(2)+'</text>';
        s += '</g>';
      });
      s += '</svg>';
      s += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--muted)">'+
        ["I","II","III"].map(function(k){
          const b = bands[k];
          return '<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:8px;height:8px;background:'+b.col+';display:inline-block;opacity:.8"></i>'+
            k+' 段带 '+b.lo.toFixed(2)+'–'+b.hi.toFixed(2)+' kA · '+b.note+'</span>';
        }).join("")+'</div>';
      return s;
    }

    function status(){
      const res = {};
      Object.keys(bands).forEach(function(k){
        const b = bands[k], v = vl[k];
        res[k] = v >= b.lo && v <= b.hi ? "ok" : v < b.lo ? "low" : "high";
      });
      return res;
    }

    function render(){
      plot.innerHTML = plotSvg();
      const st = status();
      const okN = Object.keys(st).filter(function(k){ return st[k]==="ok"; }).length;
      const iCov = (coverI(vl.I) * 100).toFixed(0);
      readout.innerHTML =
        '<div class="ro"><span>Ⅰ段 / 保护范围</span><b>'+vl.I.toFixed(2)+'<small>kA</small> · '+iCov+'<small>%</small></b></div>'+
        '<div class="ro"><span>Ⅱ段 定值</span><b>'+vl.II.toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>Ⅲ段 定值</span><b>'+vl.III.toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>定值带命中</span><b style="color:'+(okN===3?"var(--cyan)":"var(--amber)")+'">'+okN+'<small>/3</small></b></div>';
      tag.innerHTML = okN===3 ? '<b>三条定值全部进入整定带</b>' : '三条定值线待放置';
      if(!runDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch2Run">投入运行 · 三类故障检验</button>'+
          '<button class="btn" id="ch2Reset">恢复初始定值</button>';
        const rb = document.getElementById("ch2Reset");
        rb.addEventListener("click", function(){ vl.I=2.35; vl.II=1.75; vl.III=0.95; render(); log.innerHTML="已恢复初始定值。"; });

      }
    }

    plot.addEventListener("pointerdown", function(e){
      const g = e.target.closest("[data-line]");
      if(!g || runDone) return;
      dragKey = g.getAttribute("data-line");
      e.preventDefault();
    });
    window.addEventListener("pointermove", function(e){
      if(!dragKey) return;
      const svg = document.getElementById("ch2Svg");
      if(!svg) return;
      const r = svg.getBoundingClientRect();
      const py = (e.clientY - r.top) / r.height * 380;
      vl[dragKey] = clamp(pxToI(py), 0.55, 4.4);
      render();
    });
    window.addEventListener("pointerup", function(){ dragKey = null; });

    function decidePoint(d){
      const ik = curve(d);
      const list = [];
      if(d <= 1.0){
        if(ik > vl.I) list.push({r:"A 站", s:"Ⅰ段", t:0});
        if(ik > vl.II) list.push({r:"A 站", s:"Ⅱ段", t:0.5});
        if(ik > vl.III) list.push({r:"A 站", s:"Ⅲ段", t:1.5});
      } else {
        if(ik > 2.0) list.push({r:"B 站", s:"Ⅰ段", t:0});
        else if(ik > 1.0) list.push({r:"B 站", s:"Ⅱ段", t:0.5});
        if(ik > vl.II) list.push({r:"A 站", s:"Ⅱ段", t:0.5});
        if(ik > vl.III) list.push({r:"A 站", s:"Ⅲ段", t:1.5});
      }
      list.sort(function(a,b){ return a.t - b.t; });
      return {ik:ik, trips:list, first:list[0]||null};
    }

    function run(){
      if(runDone) return;
      const tests = [
        {d:0.40, label:"L1 近端（40%）"},
        {d:1.00, label:"L1 末端（100%）"},
        {d:1.60, label:"L2 中段（160%）"}
      ];
      const results = tests.map(function(t){ return Object.assign({}, t, decidePoint(t.d)); });
      const checks = [
        function(r){ return r.first && r.first.r==="A 站" && r.first.s==="Ⅰ段" && r.first.t===0; },
        function(r){ return r.first && r.first.r==="A 站" && r.first.s==="Ⅱ段" && r.first.t===0.5; },
        function(r){ return r.first && r.first.r==="B 站" && r.first.s==="Ⅰ段" && r.first.t===0 &&
          !r.trips.some(function(x){ return x.r==="A 站" && x.s==="Ⅰ段"; }); }
      ];
      runDone = true;
      results.forEach(function(r,i){ r.ok = !!checks[i](r); });
      let html = '<div style="margin-top:6px">';
      results.forEach(function(r,i){
        const times = r.trips.length ? r.trips.map(function(x){ return x.r+" "+x.s+" "+x.t.toFixed(2)+"s"; }).join(" · ") : "无开关动作";
        html += '<div id="ch2Row'+i+'" style="opacity:.45;border-left:2px solid #2b4557;padding:8px 10px;margin:8px 0;background:rgba(255,255,255,.02);transition:opacity .3s,border-color .3s">'+
          '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#dbe6f0;flex-wrap:wrap"><span>'+r.label+' · I_k = '+r.ik.toFixed(2)+' kA</span>'+
          '<span class="mono" id="ch2Trip'+i+'" style="color:#8ba3b7">等待动作…</span></div>'+
          '<div style="font-size:10.5px;color:#5e7488;margin-top:4px">候选动作：'+times+'</div>'+
        '</div>';
      });
      html += '</div>';
      document.getElementById("ch2Plot").insertAdjacentHTML("beforeend", html);
      ctrl.innerHTML = "";
      ranAnimate(results, 0);
    }

    function ranAnimate(results, i){
      if(i >= results.length){ finishRun(results); return; }
      const row = document.getElementById("ch2Row"+i);
      const trip = document.getElementById("ch2Trip"+i);
      const r = results[i];
      if(row){ row.style.opacity = "1"; row.style.borderLeftColor = r.ok ? "#3ed6c4" : "#f2636f"; }
      if(trip){
        trip.textContent = r.first ? (r.first.r+" "+r.first.s+" @ "+r.first.t.toFixed(2)+" s") : "无保护动作";
        trip.style.color = r.ok ? "#3ed6c4" : "#f2636f";
      }
      let msg = "";
      if(i===0) msg = r.ok ? '<span class="ok">Ⅰ段瞬时切除，选择性正确。</span>' : '<span class="bad">近端故障应无时限切除，当前定值没有做到。</span>';
      if(i===1) msg = r.ok ? '<span class="ok">Ⅰ段够不到末端，Ⅱ段以 0.5 s 补上全线——这正是Ⅱ段的意义。</span>' : '<span class="bad">末端故障应由Ⅱ段带 0.5 s 切除，当前配合不对。</span>';
      if(i===2) msg = r.ok ? '<span class="ok">B 站Ⅰ段先跳，A 站Ⅱ段在后备位置待命，没有越级。</span>' : '<span class="bad">A 站保护抢跳或拒动：定值越过下级，造成越级跳闸。</span>';
      log.innerHTML = '<span class="line">故障 '+r.label+'：' + msg + '</span>';
      later(function(){ ranAnimate(results, i+1); }, 950);
    }

    function finishRun(results){
      const okAll = results.every(function(r){ return r.ok; });
      const hits = ["I","II","III"].filter(function(k){ return vl[k] >= bands[k].lo && vl[k] <= bands[k].hi; }).length;
      baseScore = hits*12 + (okAll ? 24 : 0);
      const score = baseScore;
      readout.innerHTML =
        '<div class="ro"><span>三段定值</span><b style="font-size:13px">'+vl.I.toFixed(2)+' / '+vl.II.toFixed(2)+' / '+vl.III.toFixed(2)+'</b></div>'+
        '<div class="ro"><span>Ⅰ段覆盖</span><b>'+Math.min(100,(coverI(vl.I)*100)).toFixed(0)+'<small>%</small></b></div>'+
        '<div class="ro"><span>配合检验</span><b style="font-size:13px;color:'+(okAll?"var(--cyan)":"var(--red)")+'">'+(okAll?"通过":"存在越级")+'</b></div>'+
        '<div class="ro"><span>定值 + 配合</span><b>'+score+'<small>/60</small></b></div>';
      tag.innerHTML = okAll ? '<b>三类故障均正确切除</b>' : '配合检验未通过';
      log.innerHTML += '<span class="line" style="color:var(--dim)">Ⅰ段实际覆盖 '+Math.min(100,(coverI(vl.I)*100)).toFixed(0)+'% 本线路：末端那段空白，正是Ⅱ段存在的理由。' +
        (okAll ? ' 三类故障都由最近的保护以最短时限切除，配合正确。' : ' 存在越级或拒动，需要重新核对定值带。')+'</span>';
      ctrl.innerHTML = '<button class="btn" id="ch2Again">调整定值再试</button>'+
        '<button class="btn primary" id="ch2End">提交定值单</button>';
      document.getElementById("ch2Again").addEventListener("click", function(){
        runDone = false; render(); log.innerHTML = "重新拖动三条定值线，再运行一次三类故障。";
      });
      document.getElementById("ch2End").addEventListener("click", function(){
        startLadder();
      });
    }

    /* ---------- 第三关：时限阶梯 ---------- */
    const LAD = [
      {id:"b1", n:"B 站 · Ⅰ段（无时限速断）", d:"保护 B 站侧，范围只到 L1 末端附近", t:0.0},
      {id:"a2", n:"A 站 · Ⅱ段（限时速断）", d:"覆盖 L1 全长，与 B 站Ⅰ段配合", t:0.5},
      {id:"a3", n:"A 站 · Ⅲ段（定时限过电流）", d:"范围最广，越到 L2，对下级做远后备", t:1.5}
    ];
    let ladSel = null, ladPlaced = [], ladMistakes = 0, ladScore = 0, ladDone = false;
    let ladderTray = [];

    function startLadder(){
      tag.innerHTML = '<b>第三关 · 时限阶梯</b>';
      ladSel = null; ladPlaced = []; ladMistakes = 0; ladDone = false; ladScore = 0;
      ladderTray = LAD.slice().sort(function(){ return Math.random()-0.5; }).map(function(x){ return x.id; });
      plot.onclick = function(e){
        const card = e.target.closest("[data-lad]");
        if(card){ ladSel = card.getAttribute("data-lad"); renderLadder(); return; }
        const slot = e.target.closest("[data-slot]");
        if(slot){ pickLadSlot(Number(slot.getAttribute("data-slot"))); }
      };
      renderLadder();
      log.innerHTML = '定值对了，还要让时间对：把三台保护放到它该动作的时刻。先点一张卡，再点轴上的槽位。';
      ctrl.innerHTML = '';
    }

    function ladCardHtml(){
      const left = ladderTray.filter(function(id){ return !ladPlaced.some(function(p){ return p.id===id; }); });
      if(!left.length) return '<div style="font-size:12px;color:var(--dim);padding:10px 0">三张保护卡都放上去了。</div>';
      return left.map(function(id){
        const c = LAD.filter(function(x){ return x.id===id; })[0];
        return '<div class="lad-card'+(ladSel===id?' sel':'')+'" data-lad="'+id+'"><b>'+c.n+'</b><span>'+c.d+'</span></div>';
      }).join("");
    }

    function renderLadder(){
      const slots = [0.0, 0.5, 1.5];
      plot.innerHTML =
        '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em;margin-bottom:7px">待排的保护</div>'+
        '<div id="ch2Tray" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">'+ladCardHtml()+'</div>'+
        '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em;margin-bottom:7px">动作时刻 · 阶梯时限轴（级差 Δt = 0.5 s 起）</div>'+
        '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">'+
          slots.map(function(t){
            const got = ladPlaced.filter(function(p){ return p.t===t; })[0];
            return '<div style="flex:1 1 150px;min-width:140px">'+
              '<div class="lad-slot'+(got?' on':'')+(ladSel?' hot':'')+'" data-slot="'+t+'">'+
                '<i>t = '+t.toFixed(1)+' s</i><b>'+(got?got.n:'— 空 —')+'</b></div>'+
              '<div style="height:1px;background:'+(t===0?'#3ed6c4':t===1.0?'#1d2f3f':'#2b4557')+';margin:9px 0 6px"></div>'+
              '<div style="font-size:9.5px;color:var(--dim);line-height:1.5">'+(t===0?'起点':t===0.5?'Δ=0.5 s':t===1.5?'Δ=1.0 s':'')+'</div>'+
            '</div>';
          }).join("")+
        '</div>'+
        '<div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;line-height:1.8;color:var(--muted)">'+
          '<b style="color:var(--ink);font-weight:500">阶梯从下游往上游排</b>：越靠近电源、保护范围越宽的保护，时限越长。这样下游故障由下游先切除，上游只在下游拒动时才补刀——这就是"选择性"的时间版本。'+
        '</div>';
      readout.innerHTML =
        '<div class="ro"><span>已归位</span><b>'+ladPlaced.length+'<small>/3</small></b></div>'+
        '<div class="ro"><span>放错次数</span><b style="color:'+(ladMistakes?'var(--amber)':'var(--cyan)')+'">'+ladMistakes+'</b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+ladScore+'<small>/20</small></b></div>'+
        '<div class="ro"><span>状态</span><b style="font-size:13px;color:'+(ladDone?'var(--cyan)':'var(--muted)')+'">'+(ladDone?'阶梯成立':'排布中')+'</b></div>';
    }

    function pickLadSlot(t){
      if(ladDone || !ladSel) return;
      const card = LAD.filter(function(x){ return x.id===ladSel; })[0];
      if(card.t !== t){
        ladMistakes++;
        const hint = card.t > t
          ? '「'+card.n+'」的时限比这更晚：它的保护范围最宽，若提前到 '+t.toFixed(1)+' s，下游故障它会先跳，形成越级。'
          : '「'+card.n+'」的时限比这更早：它离故障更近、范围更窄，必须先把 '+t.toFixed(1)+' s 这个位置让给下游。';
        log.innerHTML = '<span class="bad">放不进去。</span> '+hint+
          '<span class="line" style="color:var(--dim)">放错 '+ladMistakes+' 次（每次扣 4 分，最低保 8 分）</span>';
        renderLadder();
        return;
      }
      ladPlaced.push({id:card.id, n:card.n, t:card.t});
      ladSel = null;
      log.innerHTML = '<span class="ok">归位正确。</span> '+card.n+' 在 t = '+t.toFixed(1)+' s 动作：'+card.d+'。';
      renderLadder();
      if(ladPlaced.length === 3) finishLadder();
    }

    function finishLadder(){
      ladDone = true;
      ladScore = Math.max(8, 20 - ladMistakes*4);
      renderLadder();
      log.innerHTML = '<span class="ok">阶梯成立：0 s → 0.5 s → 1.5 s。</span> 下游 B 站Ⅰ段先动；A 站Ⅱ段晚 0.5 s，只在 B 站Ⅰ段拒动时补位；A 站Ⅲ段 1.5 s 兜底，做远后备。'+
        '<span class="line" style="color:var(--dim)">本关得分 '+ladScore+' / 20'+(ladMistakes?' · 放错 '+ladMistakes+' 次':' · 一次排对')+'</span>';
      ctrl.innerHTML = '<button class="btn" id="ch2LadRetry">重新排布</button>'+
        '<button class="btn primary" id="ch2LadEnd">进入躲负荷整定</button>';
      document.getElementById("ch2LadRetry").addEventListener("click", startLadder);
      document.getElementById("ch2LadEnd").addEventListener("click", function(){
        startIII();
      });
    }

    /* ---------- 第四关：Ⅲ段躲负荷 ---------- */
    const III = {lo:1.81, hi:2.00, min:1.00, max:2.60};
    let iiiVal = 1.35, iiiScore = 0, iiiDone = false, iiiTry = 0;

    function iiiSvg(){
      const x0 = 70, x1 = 690, sx = v => x0 + (v - III.min) / (III.max - III.min) * (x1 - x0);
      let g = '<svg viewBox="0 0 760 190" role="img" aria-label="Ⅲ段躲负荷整定区间">'+SVG_DEFS;
      g += '<text x="'+x0+'" y="26" font-size="10" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">Ⅲ段定值（kA）· 往下躲自起动，往上保灵敏</text>';
      g += '<rect x="'+sx(1.00)+'" y="58" width="'+(sx(1.05)-sx(1.00))+'" height="38" fill="rgba(169,156,245,.18)" stroke="#1d2f3f"/>';
      g += '<rect x="'+sx(1.05)+'" y="58" width="'+(sx(1.58)-sx(1.05))+'" height="38" fill="rgba(169,156,245,.08)" stroke="#1d2f3f"/>';
      g += '<rect x="'+sx(1.58)+'" y="58" width="'+(sx(III.lo)-sx(1.58))+'" height="38" fill="rgba(244,183,74,.12)" stroke="#1d2f3f"/>';
      g += '<rect x="'+sx(III.lo)+'" y="58" width="'+(sx(III.hi)-sx(III.lo))+'" height="38" fill="rgba(62,214,196,.20)" stroke="rgba(62,214,196,.6)"/>';
      g += '<rect x="'+sx(III.hi)+'" y="58" width="'+(sx(2.60)-sx(III.hi))+'" height="38" fill="rgba(242,99,111,.12)" stroke="#1d2f3f"/>';
      g += '<text x="'+sx(1.02)+'" y="84" font-size="9" fill="#a99cf5" font-family="ui-monospace,Menlo,monospace">负荷 1.05</text>';
      g += '<text x="'+((sx(1.05)+sx(1.58))/2)+'" y="84" text-anchor="middle" font-size="8.5" fill="#a99cf5" font-family="ui-monospace,Menlo,monospace">自起动</text>';
      g += '<text x="'+((sx(III.lo)+sx(III.hi))/2)+'" y="52" text-anchor="middle" font-size="9" fill="#3ed6c4" font-family="ui-monospace,Menlo,monospace">合格区 1.81–2.00</text>';
      g += '<text x="'+sx(2.26)+'" y="84" text-anchor="middle" font-size="9" fill="#f2636f" font-family="ui-monospace,Menlo,monospace">灵敏性不够</text>';
      g += '<line x1="'+x0+'" y1="100" x2="'+x1+'" y2="100" stroke="#2b4557" stroke-width="1"/>';
      for(let v=1.0; v<=2.6001; v+=0.1){
        g += '<line x1="'+sx(v)+'" y1="100" x2="'+sx(v)+'" y2="106" stroke="#2b4557"/>';
        g += '<text x="'+sx(v)+'" y="122" text-anchor="middle" font-size="8" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+v.toFixed(1)+'</text>';
      }
      const inBand = iiiVal >= III.lo && iiiVal <= III.hi;
      const col = inBand ? "#3ed6c4" : "#f4b74a";
      g += '<line x1="'+sx(iiiVal)+'" y1="44" x2="'+sx(iiiVal)+'" y2="112" stroke="'+col+'" stroke-width="2"/>';
      g += '<text x="'+sx(iiiVal)+'" y="40" text-anchor="middle" font-size="10.5" fill="'+col+'" font-family="ui-monospace,Menlo,monospace">'+iiiVal.toFixed(2)+' kA</text>';
      g += '<text x="'+x0+'" y="152" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">下限：1.15（可靠系数）× 1.5（自起动系数）× 1.05 kA（最大负荷）= 1.81 kA</text>';
      g += '<text x="'+x0+'" y="170" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">上限：3.0 kA（末端最小短路电流）/ 1.5（要求灵敏系数）= 2.00 kA</text>';
      g += '</svg>';
      return g;
    }

    function renderIII(){
      plot.onclick = null;
      plot.innerHTML = iiiSvg()+
        '<div class="slider-row"><label>Ⅲ段定值</label><input type="range" id="ch2III" min="'+III.min+'" max="'+III.max+'" step="0.01" value="'+iiiVal+'"><span class="val">'+iiiVal.toFixed(2)+' kA</span></div>';
      document.getElementById("ch2III").addEventListener("input", function(e){ iiiVal = Number(e.target.value); renderIII(); });
      readout.innerHTML =
        '<div class="ro"><span>Ⅲ段定值</span><b>'+iiiVal.toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>躲负荷裕度</span><b>'+((iiiVal/1.05-1.0)*100).toFixed(0)+'<small>%</small></b></div>'+
        '<div class="ro"><span>末端灵敏系数</span><b>'+(3.0/iiiVal).toFixed(2)+'</b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+iiiScore+'<small>/20</small></b></div>';
      tag.innerHTML = '<b>第四关 · Ⅲ段躲负荷</b>';
      if(!iiiDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch2IIIRun">校核 Ⅲ段定值</button>';
        document.getElementById("ch2IIIRun").addEventListener("click", runIII);
      } else {
        ctrl.innerHTML = '<button class="btn" id="ch2IIIAgain">再调一次</button>'+
          '<button class="btn primary" id="ch2IIIEnd">提交定值单</button>';
        document.getElementById("ch2IIIAgain").addEventListener("click", function(){ iiiDone=false; renderIII(); log.innerHTML="重新拖动滑块，让指针落进绿色合格区。"; });
        document.getElementById("ch2IIIEnd").addEventListener("click", finishAll);
      }
    }

    function startIII(){
      iiiDone = false; iiiScore = 0; iiiVal = 1.35; iiiTry = 0;
      renderIII();
      log.innerHTML = 'Ⅲ段是最后一道防线，定值要同时满足两个方向：往下躲过负荷侧电动机自起动电流，往上保证本线路末端故障时灵敏系数够。拖动滑块，让指针落进绿色合格区。';
    }

    function runIII(){
      iiiTry++;
      const inBand = iiiVal >= III.lo && iiiVal <= III.hi;
      const margin = Math.min(Math.abs(iiiVal-III.lo), Math.abs(iiiVal-III.hi));
      let sc = 0, msg = "";
      if(inBand){
        sc = 20;
        msg = '<span class="ok">整定合格。</span> '+iiiVal.toFixed(2)+' kA 落在 1.81~2.00 之间：躲过了自起动冲击，末端灵敏系数 '+(3.0/iiiVal).toFixed(2)+' 也够。';
      } else if(iiiVal < III.lo){
        sc = margin <= 0.08 ? 12 : margin <= 0.18 ? 6 : 0;
        msg = '<span class="bad">定值偏低，躲不过自起动。</span> 电动机自起动时电流可达 1.58 kA，定值 '+iiiVal.toFixed(2)+' kA 会被它冲开，正常运行时误跳闸。';
      } else {
        sc = margin <= 0.08 ? 12 : margin <= 0.18 ? 6 : 0;
        msg = '<span class="bad">定值偏高，灵敏性不足。</span> 末端最小短路电流只有 3.0 kA，定值 '+iiiVal.toFixed(2)+' kA 的灵敏系数仅 '+(3.0/iiiVal).toFixed(2)+'，远处故障它看不见。';
      }
      if(sc > iiiScore) iiiScore = sc;
      iiiDone = true;
      log.innerHTML = msg + '<span class="line" style="color:var(--dim)">本关得分 '+sc+' / 20 · 已记录最高分 '+iiiScore+' / 20（第 '+iiiTry+' 次校核）</span>';
      renderIII();
    }

    function finishAll(){
        const total = Math.min(100, baseScore + ladScore + iiiScore);
        const st = total >= 90 ? 3 : total >= 70 ? 2 : 1;
        finish(2, total, st, [
          "Ⅰ段按躲过本线路末端最大短路电流整定，因此天然保护不到全长，实际覆盖约 70%~85%。",
          "Ⅱ段与下级Ⅰ段配合，用 0.5 s 的级差换回全线覆盖；它是本线路的近后备。",
          "Ⅲ段按躲过最大负荷电流整定，时限逐级加长，对下级线路做远后备。"
        ], "三段式电流保护：Ⅰ段无时限电流速断，靠定值取得选择性、按末端最大短路电流整定；Ⅱ段限时电流速断，与下级Ⅰ段配合，保护本线路全长并做近后备；Ⅲ段定时限过电流，躲过最大负荷电流，按阶梯时限逐级配合，做近后备与远后备。级差 Δt 一般取 0.3~0.5 s。");
    }

    render();
    const onUp = function(){ dragKey = null; };
    window.addEventListener("pointerup", onUp);
    return function(){ window.removeEventListener("pointerup", onUp); };
  }
};

          <p class="tip">阻抗平面里，圆就是动作区：测量阻抗落进圆内，保护动作；落在圆外，保护不动作。</p>
        </div>
      </aside>
