      </main>
    </div>`;
  },
  init(){
    const u = {r:3/Math.hypot(3,12), x:12/Math.hypot(3,12)};
    const Z1 = Math.hypot(3,12);
    const S = 20, X0 = 100, Y0 = 540;
    let mode = "dir";
    let zset = 8.0;
    let checked = false;
    let drag = false;

    const plot = document.getElementById("ch3Plot");
    const ctrl = document.getElementById("ch3Ctrl");
    const readout = document.getElementById("ch3Readout");
    const log = document.getElementById("ch3Log");
    const tag = document.getElementById("ch3Tag");

    const px = R => X0 + (R + 4) * S;
    const py = X => Y0 - (X + 4) * S;
    function params(){
      if(mode === "full") return {cr:0, cx:0, rad:zset};
      if(mode === "offset") return {cr:0.45*zset*u.r, cx:0.45*zset*u.x, rad:0.55*zset};
      return {cr:zset/2*u.r, cx:zset/2*u.x, rad:zset/2};
    }
    function inside(R, X, p){
      return Math.hypot(R - p.cr, X - p.cx) <= p.rad + 1e-9;
    }

    const tests = [
      {R:1.80, X:7.20, n:"区内 60%", must:true},
      {R:2.91, X:11.64, n:"末端 97%", must:false},
      {R:-1.05, X:-4.20, n:"反方向 35%", must:false},
      {R:18, X:6, n:"负荷阻抗", must:false}
    ];

    function plotSvg(){
      const p = params();
      let s = '<svg viewBox="0 0 760 700" id="ch3Svg" role="img" aria-label="阻抗平面与动作特性圆">'+SVG_DEFS;
      // 网格
      s += '<g stroke="#16242f" stroke-width="1">';
      for(let v=-4; v<=22; v+=4){
        s += '<line x1="'+px(v)+'" y1="'+py(-4)+'" x2="'+px(v)+'" y2="'+py(22)+'"/>';
        s += '<line x1="'+px(-4)+'" y1="'+py(v)+'" x2="'+px(22)+'" y2="'+py(v)+'"/>';
      }
      s += '</g>';
      // 坐标轴
      s += '<line x1="'+px(-4)+'" y1="'+py(0)+'" x2="'+px(22)+'" y2="'+py(0)+'" stroke="#2b4557" stroke-width="1.4"/>';
      s += '<line x1="'+px(0)+'" y1="'+py(-4)+'" x2="'+px(0)+'" y2="'+py(22)+'" stroke="#2b4557" stroke-width="1.4"/>';
      s += '<text x="'+px(22)+'" y="'+(py(0)-8)+'" text-anchor="end" font-size="10" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">R / Ω</text>';
      s += '<text x="'+(px(0)-8)+'" y="'+(py(21.4))+'" text-anchor="end" font-size="10" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">X / Ω</text>';
      for(let v=4; v<=20; v+=4){
        s += '<text x="'+px(v)+'" y="'+(py(0)+16)+'" text-anchor="middle" font-size="9" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+v+'</text>';
        s += '<text x="'+(px(0)-8)+'" y="'+(py(v)+3)+'" text-anchor="end" font-size="9" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+v+'</text>';
      }
      // 负荷区
      s += '<circle cx="'+px(18)+'" cy="'+py(6)+'" r="3.2" fill="rgba(169,156,245,.10)" stroke="rgba(169,156,245,.45)" stroke-width="1"/>';
      s += '<text x="'+px(14.2)+'" y="'+(py(6)+5)+'" text-anchor="end" font-size="9.5" fill="#a99cf5" font-family="ui-monospace,Menlo,monospace">负荷区</text>';
      // 线路阻抗轴
      s += '<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(6.2)+'" y2="'+py(24.8)+'" stroke="#3a5a70" stroke-width="7" opacity=".35"/>';
      s += '<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(3)+'" y2="'+py(12)+'" stroke="#7fa6c0" stroke-width="2"/>';
      s += '<line x1="'+px(3)+'" y1="'+py(12)+'" x2="'+px(6)+'" y2="'+py(24)+'" stroke="#7fa6c0" stroke-width="2" stroke-dasharray="6 4" opacity=".8"/>';
      s += '<circle cx="'+px(3)+'" cy="'+py(12)+'" r="3.5" fill="#dbe6f0"/>';
      s += '<text x="'+(px(3)-12)+'" y="'+(py(12)-10)+'" text-anchor="end" font-size="9.5" fill="#dbe6f0" font-family="ui-monospace,Menlo,monospace">100% · Z_L</text>';
      s += '<text x="'+(px(3)-12)+'" y="'+(py(12)+6)+'" text-anchor="end" font-size="8.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">本线路末端</text>';
      s += '<text x="'+(px(6)+8)+'" y="'+(py(22)+8)+'" font-size="9" fill="#7fa6c0" font-family="ui-monospace,Menlo,monospace">相邻线路 200%</text>';
      // 85% 目标带（沿射线方向的短条带，半宽 12px）
      const vx = -u.x, vy = u.r;   // 垂直方向
      function bandRect(t1, t2){
        const a = [px(t1*3), py(t1*12)], b2 = [px(t2*3), py(t2*12)];
        const w = 13;
        return [[a[0]-vx*w, a[1]+vy*w],[b2[0]-vx*w, b2[1]+vy*w],
                [b2[0]+vx*w, b2[1]-vy*w],[a[0]+vx*w, a[1]-vy*w]];
      }
      const rectPts = bandRect(0.82, 0.90).map(function(q){ return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ");
      s += '<polygon points="'+rectPts+'" fill="rgba(244,183,74,.18)" stroke="rgba(244,183,74,.55)" stroke-width="1"/>';
      // 特性圆
      const cx = px(p.cr), cy = py(p.cx), rr = p.rad * S;
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="rgba(62,214,196,.09)" stroke="#3ed6c4" stroke-width="1.6" opacity=".95"/>';
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(rr-2)+'" fill="none" stroke="rgba(62,214,196,.35)" stroke-width="1"/>';
      // 方向指示
      s += '<path d="M'+(px(0)+6)+' '+(py(0)-6)+' l34 -38" stroke="rgba(62,214,196,.45)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>';
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#3ed6c4" opacity=".7"/>';
      s += '<text x="'+(cx+9)+'" y="'+(cy-9)+'" font-size="9" fill="#3ed6c4" font-family="ui-monospace,Menlo,monospace">圆心</text>';
      // 手柄
      const hR = zset*u.r, hX = zset*u.x;
      s += '<g data-handle style="cursor:ew-resize">';
      s += '<circle cx="'+px(hR)+'" cy="'+py(hX)+'" r="20" fill="transparent"/>';
      s += '<circle cx="'+px(hR)+'" cy="'+py(hX)+'" r="8" fill="#f4b74a" stroke="#0a131d" stroke-width="2"/>';
      s += '<text x="'+(px(hR)+16)+'" y="'+(py(hX)-12)+'" font-size="9.5" fill="#f4b74a" font-family="ui-monospace,Menlo,monospace">Z_set</text>';
      s += '</g>';
      // 测量点（编号）
      tests.forEach(function(t, i){
        const ok = inside(t.R, t.X, params());
        const good = (t.must === ok);
        const col = checked ? (good ? "#3ed6c4" : "#f2636f") : "#8ba3b7";
        s += '<g opacity=".95">';
        s += '<circle cx="'+px(t.R)+'" cy="'+py(t.X)+'" r="9" fill="'+col+'" opacity=".14"/>';
        s += '<circle cx="'+px(t.R)+'" cy="'+py(t.X)+'" r="8" fill="#0a131d" stroke="'+col+'" stroke-width="1.1"/>';
        s += '<text x="'+px(t.R)+'" y="'+(py(t.X)+3.5)+'" text-anchor="middle" font-size="8.5" fill="'+col+'" font-family="ui-monospace,Menlo,monospace">'+(i+1)+'</text>';
        s += '</g>';
      });
      s += '</svg>';
      // 图例
      const lg = tests.map(function(t,i){
        const ok = inside(t.R, t.X, params());
        const good = t.must === ok;
        const col = checked ? (good ? "#3ed6c4" : "#f2636f") : "#5e7488";
        return '<span style="display:inline-flex;align-items:center;gap:6px">'+
          '<b style="width:15px;height:15px;border:1px solid '+col+';border-radius:50%;display:inline-grid;place-items:center;font-size:9px;color:'+col+'">'+(i+1)+'</b>'+
          '<span>'+t.n+' · '+(checked ? (ok?"动作":"不动作")+(good?"":"（错误）") : "待校验")+'</span></span>';
      }).join("");
      return s + '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--muted)">'+lg+
        '<span style="color:var(--dim)">橙色短段 = 0.85 Z_L 目标</span></div>';
    }

    function refresh(){
      plot.innerHTML = plotSvg();
      const p = params();
      const cov = zset / Z1 * 100;
      const modeName = mode==="dir" ? "方向阻抗圆" : mode==="full" ? "全阻抗圆" : "偏移圆（10%）";
      readout.innerHTML =
        '<div class="ro"><span>整定阻抗</span><b>'+zset.toFixed(2)+'<small>Ω</small></b></div>'+
        '<div class="ro"><span>保护范围</span><b>'+cov.toFixed(0)+'<small>% Z_L</small></b></div>'+
        '<div class="ro"><span>动作特性</span><b style="font-size:13px">'+modeName+'</b></div>'+
        '<div class="ro"><span>校验</span><b style="font-size:13px;color:'+(checked?(tests.every(function(t){return t.must===inside(t.R,t.X,p);})?"var(--cyan)":"var(--red)"):"var(--dim)")+'">'+(checked?(tests.every(function(t){return t.must===inside(t.R,t.X,p);})?"全部正确":"存在误动/拒动"):"待校验")+'</b></div>';
      tag.innerHTML = checked ? '<b>四类测量点已校验</b>' : '请选择动作特性并整定';
    }

    plot.addEventListener("pointerdown", function(e){
      if(checked) return;
      drag = true;
      e.preventDefault();
    });
    const move = function(e){
      if(!drag) return;
      const svg = document.getElementById("ch3Svg");
      if(!svg) return;
      const r = svg.getBoundingClientRect();
      const X = (e.clientX - r.left) / r.width * 760;
      const Y = (e.clientY - r.top) / r.height * 700;
      const R = (X - X0)/S - 4;
      const XX = (Y0 - Y)/S - 4;
      zset = clamp(R*u.r + XX*u.x, 4.5, 14.5);
      refresh();
    };
    window.addEventListener("pointermove", move);
    const up = function(){ drag = false; };
    window.addEventListener("pointerup", up);

    function renderCtrl(){
      const modes = [
        {k:"dir", t:"方向阻抗圆", d:"有方向，反方向不动作"},
        {k:"full", t:"全阻抗圆", d:"无方向，反方向也动作"},
        {k:"offset", t:"偏移圆", d:"向反方向略偏，消除出口死区"}
      ];
      ctrl.innerHTML = modes.map(function(m){
        return '<button class="btn sm '+(mode===m.k?"primary":"")+'" data-mode="'+m.k+'" title="'+m.d+'">'+m.t+'</button>';
      }).join("") +
        '<span style="width:1px;height:20px;background:var(--line2);margin:0 4px"></span>'+
        '<button class="btn sm" id="ch3Check">校验四类故障</button>'+
        '<button class="btn sm primary" id="ch3End" '+(checked?'':'disabled')+'>提交定值</button>';
      ctrl.querySelectorAll("[data-mode]").forEach(function(b){
        b.addEventListener("click", function(){ mode = b.getAttribute("data-mode"); checked=false; renderCtrl(); refresh(); log.innerHTML="特性已切换为"+b.textContent+"。重新校验看看反方向故障会不会误动。"; });
      });
      document.getElementById("ch3Check").addEventListener("click", check);
      const end = document.getElementById("ch3End");
      if(end) end.addEventListener("click", submit);
    }

    function check(){
      checked = true;
      refresh();
      const p = params();
      const wins = tests.filter(function(t){ return t.must === inside(t.R, t.X, p); }).length;
      log.innerHTML = '<span class="line">校验结果：'+wins+' / 4 个测量点的行为符合预期。</span>'+
        '<span class="line" style="color:var(--dim)">'+
        (inside(tests[2].R, tests[2].X, p) ? '<span class="bad">反方向测量点落入动作区</span>：全阻抗圆没有方向性，反方向故障会误动。' : '<span class="ok">反方向被可靠排除。</span>')+
        ' '+(inside(tests[1].R, tests[1].X, p) ? '<span class="bad">末端 97% 落入圆内</span>：Ⅰ段伸进了相邻线路，区外故障会越界跳闸。' : '<span class="ok">末端 97% 落在圆外，选择性保住了。</span>')+
        '</span>';
      renderCtrl();
    }

    function submit(){
      const p = params();
      const okAll = tests.every(function(t){ return t.must === inside(t.R, t.X, p); });
      const modeScore = mode === "dir" ? 15 : mode === "offset" ? 12 : 0;
      const bandScore = zset/Z1 >= 0.82 && zset/Z1 <= 0.90 ? 20 : zset/Z1 > 0.78 && zset/Z1 < 0.95 ? 9 : 0;
      baseScore3 = modeScore + bandScore + (okAll ? 25 : 0);
      startSec2();
    }

    /* ---------- 第三关：Ⅱ 段整定 ---------- */
    let z2 = 15.0, sec2Score = 0, baseScore3 = 0;
    function sec2Coverage(){ return z2 / Z1; }

    function sec2Svg(){
      const cmin = 0.95, cmax = 1.60;
      const bx = c => 70 + (c - cmin) / (cmax - cmin) * 620;
      const bands = [
        {a:0.95, b:1.00, col:"rgba(242,99,111,.14)", lab:"空白"},
        {a:1.00, b:1.15, col:"rgba(244,183,74,.13)", lab:"刚够末端"},
        {a:1.15, b:1.35, col:"rgba(62,214,196,.16)", lab:"合格区"},
        {a:1.35, b:1.60, col:"rgba(242,99,111,.14)", lab:"伸进下级Ⅰ段"}
      ];
      let g = '<svg viewBox="0 0 760 150" role="img" aria-label="Ⅱ段整定范围">'+SVG_DEFS;
      g += '<text x="70" y="26" font-size="10" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">Ⅱ段覆盖范围（相对 Z_L）</text>';
      bands.forEach(function(b){
        g += '<rect x="'+bx(b.a)+'" y="60" width="'+(bx(b.b)-bx(b.a))+'" height="40" fill="'+b.col+'" stroke="#1d2f3f" stroke-width="1"/>';
        g += '<text x="'+((bx(b.a)+bx(b.b))/2)+'" y="84" text-anchor="middle" font-size="9" fill="#8ba3b7" font-family="ui-monospace,Menlo,monospace">'+b.lab+'</text>';
      });
      g += '<line x1="70" y1="100" x2="690" y2="100" stroke="#2b4557" stroke-width="1"/>';
      for(let c=1.0; c<=1.6; c+=0.05){
        g += '<line x1="'+bx(c)+'" y1="100" x2="'+bx(c)+'" y2="106" stroke="#2b4557" stroke-width="1"/>';
        if(Math.abs(c*100 % 10) < 0.5) g += '<text x="'+bx(c)+'" y="122" text-anchor="middle" font-size="8.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+c.toFixed(2)+'</text>';
      }
      const cur = clamp(sec2Coverage(), cmin, cmax);
      const okBand = sec2Coverage() >= 1.15 && sec2Coverage() <= 1.35;
      const mc = okBand ? "#3ed6c4" : "#f4b74a";
      g += '<line x1="'+bx(cur)+'" y1="50" x2="'+bx(cur)+'" y2="112" stroke="'+mc+'" stroke-width="2"/>';
      g += '<text x="'+bx(cur)+'" y="42" text-anchor="middle" font-size="10.5" fill="'+mc+'" font-family="ui-monospace,Menlo,monospace">'+(sec2Coverage()*100).toFixed(0)+'%</text>';
      g += '<text x="690" y="140" text-anchor="end" font-size="9.5" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">合格区：1.15 ~ 1.35 Z_L</text>';
      g += '</svg>';
      return g;
    }

    function startSec2(){
      tag.innerHTML = '第三关 · Ⅱ 段整定';
      plot.innerHTML =
        '<div style="font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:6px">'+
          'Ⅰ段已经盖住本线路的 85% 左右，末端还剩一小段空白——这一段由 Ⅱ 段补。Ⅱ 段要求：<b style="color:var(--ink);font-weight:500">盖过本线路全长，同时不伸进下级线路Ⅰ段的动作区</b>。'+
        '</div>'+
        '<div id="ch3Sec2Svg">'+sec2Svg()+'</div>'+
        '<div class="slider-row" style="margin-top:10px"><label>Z<sub>set.Ⅱ</sub></label><input type="range" id="ch3Z2" min="12" max="19" step="0.1" value="'+z2+'"><span class="val" id="ch3Z2Val"></span></div>'+
        '<p class="tip" style="margin-top:4px">Ⅱ段与下级Ⅰ段配合：本级Ⅱ段 = 1.1~1.2 倍本线路阻抗，通常再校验一次"不超出下级Ⅰ段范围"。末端电压低、过渡电阻影响大，Ⅱ段的灵敏度反而要做足。</p>';
      readout.innerHTML =
        '<div class="ro"><span>Z<sub>L</sub></span><b>'+Z1.toFixed(2)+'<small>Ω</small></b></div>'+
        '<div class="ro"><span>Ⅱ段覆盖</span><b id="ch3R2cov">—</b></div>'+
        '<div class="ro"><span>Ⅰ段已得</span><b>'+baseScore3+'<small>/60</small></b></div>'+
        '<div class="ro"><span>本关得分</span><b id="ch3R2sc">0<small>/20</small></b></div>';
      ctrl.innerHTML = '<button class="btn primary" id="ch3Z2End">提交Ⅱ段定值</button>';
      var inp = document.getElementById("ch3Z2");
      var sync = function(){
        z2 = Number(inp.value);
        document.getElementById("ch3Sec2Svg").innerHTML = sec2Svg();
        document.getElementById("ch3Z2Val").textContent = z2.toFixed(1) + " Ω";
        var cov = sec2Coverage();
        var el = document.getElementById("ch3R2cov");
        if(el){ el.innerHTML = (cov*100).toFixed(0) + '<small>% Z_L</small>'; el.style.color = (cov>=1.15&&cov<=1.35) ? "var(--cyan)" : "var(--amber)"; }
      };
      inp.addEventListener("input", sync);
      sync();
      document.getElementById("ch3Z2End").addEventListener("click", function(){
        var cov = sec2Coverage();
        sec2Score = (cov >= 1.15 && cov <= 1.35) ? 20 : (cov >= 1.10 && cov <= 1.40) ? 12 : 0;
        startSel();
      });
    }

    /* ---------- 第四关：动作特性选型 ---------- */
    const SEL = [
      {id:"a", n:"场景 A · 110 kV 城市短线路", d:"线路短，出口附近故障多，动作死区必须消除", right:"offset",
       why:"偏移圆向反方向偏移一小段，出口处 Z_m 趋近 0 时仍能动作；方向元件又把反方向故障挡在外面。"},
      {id:"b", n:"场景 B · 220 kV 长线路", d:"区外故障多，反方向穿越潮流大，绝不能反向误动", right:"dir",
       why:"方向阻抗圆的圆周过原点，反方向测量阻抗天然落在圆外，从原理上杜绝反向误动。"},
      {id:"c", n:"场景 C · 10 kV 单电源辐射线路", d:"功率只从电源流向负荷，不存在反方向潮流", right:"full",
       why:"既然没有反方向故障的可能，全阻抗圆最简洁可靠，也避免了方向元件在低压小电流下判不准的问题。"}
    ];
    const SEL_OPTS = [{k:"dir",n:"方向阻抗圆"},{k:"offset",n:"偏移圆"},{k:"full",n:"全阻抗圆"}];
    let selPick = {}, selDone = false, selScore = 0, selTry = 0;

    function renderSel(){
      tag.innerHTML = '<b>第四关 · 动作特性选型</b>';
      plot.innerHTML =
        '<div style="font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:10px">同一个阻抗判据，装在不同线路上要选不同的动作特性。给三个现场各配一种特性，注意死区、反方向误动和简洁可靠之间的取舍。</div>'+
        SEL.map(function(x){
          const cur = selPick[x.id];
          return '<div style="border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin:10px 0;background:rgba(255,255,255,.02)">'+
            '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">'+
              '<b style="font-size:13px;font-weight:500">'+x.n+'</b>'+
              '<span class="mono" style="font-size:10px;color:'+(cur?(cur===x.right?'var(--cyan)':'var(--red)'):'var(--dim)')+'">'+
                (cur?(cur===x.right?'已选：'+SEL_OPTS.filter(function(o){return o.k===cur;})[0].n:'待调整'):'未选择')+'</span>'+
            '</div>'+
            '<div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin:5px 0 10px">'+x.d+'</div>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
              SEL_OPTS.map(function(o){
                const on = cur === o.k;
                return '<button class="btn sm '+(on?"primary":"")+'" data-sel="'+x.id+'" data-opt="'+o.k+'" '+(selDone?'disabled':'')+'>'+o.n+'</button>';
              }).join("")+
            '</div>'+
            (selDone ? '<div style="margin-top:9px;font-size:11.5px;line-height:1.7;color:'+(cur===x.right?'var(--cyan)':'var(--red)')+'">'+(cur===x.right?'✓ 正确。':'✕ 不适用。')+x.why+'</div>' : '')+
          '</div>';
        }).join("");
      readout.innerHTML =
        '<div class="ro"><span>已配置</span><b>'+Object.keys(selPick).length+'<small>/3</small></b></div>'+

    function startSel(){

    }

    renderCtrl();
    refresh();
    return function(){ window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  }
};

      g += '<text x="590" y="212" text-anchor="middle" font-size="9" fill="'+(polN?"#3ed6c4":"#f2636f")+'" font-family="ui-monospace,Menlo,monospace">I_N 1.20</text>';

      g += '</svg>';
      return g;
    }

    function renderPol(){
      stage.innerHTML = polSvg();
      readout.innerHTML =
        '<div class="ro"><span>M 端 TA</span><b style="font-size:13px;color:'+(polM?"var(--cyan)":"var(--red)")+'">'+(polM?"指向线路":"指向母线")+'</b></div>'+
        '<div class="ro"><span>N 端 TA</span><b style="font-size:13px;color:'+(polN?"var(--cyan)":"var(--red)")+'">'+(polN?"指向线路":"指向母线")+'</b></div>'+
        '<div class="ro"><span>差动电流</span><b style="color:'+(polId()<0.1?"var(--cyan)":"var(--red)")+'">'+polId().toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+polScore+'<small>/20</small></b></div>';

      if(!polDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch4PolRun">模拟区外故障</button>';
        document.getElementById("ch4PolRun").addEventListener("click", runPol);
      } else {
        ctrl.innerHTML = '<button class="btn" id="ch4PolAgain">重新核对</button>'+
          '<button class="btn primary" id="ch4PolEnd">提交会诊记录</button>';
        document.getElementById("ch4PolAgain").addEventListener("click", startPolarity);
        document.getElementById("ch4PolEnd").addEventListener("click", finishAll4);
      }
      stage.onclick = function(e){
        const g = e.target.closest("[data-pol]");
        if(!g || polDone) return;
        const x = Number(g.getAttribute("data-pol"));
        if(x < 400) polM = !polM; else polN = !polN;
        renderPol();
        log.innerHTML = 'TA 极性已切换。注意：差动保护比较的是两端电流的同一参考方向，两端 TA 必须"同极性"接入。';
      };
    }

    function startPolarity(){
      polM = Math.random() < 0.5;
      polN = !polM;
      polDone = false; polScore = 0; polRun = false; polTry = 0;
      renderPol();
      log.innerHTML = '会诊结束，回到装置本身：两端 TA 的极性接反了没有？点 TA 上的箭头切换方向，然后模拟一次区外故障，看差动电流是否归零。';
    }

    function runPol(){
      polRun = true; polDone = true; polTry++;
      const id = polId();
      if(id < 0.1){
        polScore = 20;
        log.innerHTML = '<span class="ok">极性正确，差动电流归零。</span> 区外故障时穿越电流从 M 侧流入、从 N 侧流出，两端同极性接入后二次电流相互抵消，I_d ≈ 0，保护可靠不动作。'+
          '<span class="line" style="color:var(--dim)">本关得分 20 / 20</span>';

        polScore = 0;
        log.innerHTML = '<span class="bad">一端极性接反，区外故障误动。</span> 两端二次电流不再相减而是相加，I_d = 2 × 1.20 = 2.40 kA，保护把区外故障当成区内故障跳闸。'+
          '<span class="line" style="color:var(--dim)">本关得分 0 / 20 · 第 '+polTry+' 次模拟，可重新核对</span>';
      }
      renderPol();
    }

    function finishAll4(){
        const total = Math.min(100, score + polScore);
        const st = total >= 90 ? 3 : total >= 70 ? 2 : 1;
        finish(4, total, st, [
        "纵联保护比较的是两端信息：方向一致且差动电流大 → 区内；任一端反方向或差动电流很小 → 区外。",
        "它的价值是全线速动：不受阶段式阶梯时限的限制，线路上任何一点故障都能在第一个周波切除。",
        "通道是纵联保护的命门。通道中断必须闭锁并转后备，宁可慢，不可误。"
      ], "纵联保护利用通信通道比较线路两端的电气量，分为方向比较式、电流差动式和相位比较式，通道可用光纤、电力线载波或微波。区内故障时两端电流均指向线路、差动电流大；区外故障时一端电流反相、差动电流近似为零。两端 TA 必须同极性接入，否则区外故障会因两端电流相加而误动。通道故障时保护应闭锁，由阶段式后备延时切除。");
    }

    draw();
    return function(){};
  }
};

          document.getElementById("ch5Close").addEventListener("click", function(){ doClose(); });
        }
        document.getElementById("ch5Wait").addEventListener("click", function(){
          log.innerHTML = '<span class="warn">继续等待……</span> 注意窗口末端，超过之后系统功角摆开，重合冲击会更大。';
        });
      } else if(state === "trip_again"){
        ctrl.innerHTML = '<button class="btn" id="ch5Again">再次重合</button>'+
          '<button class="btn primary" id="ch5Stop">闭锁重合闸 · 不再重合</button>';
        document.getElementById("ch5Again").addEventListener("click", function(){ decideAgain(true); });
        document.getElementById("ch5Stop").addEventListener("click", function(){ decideAgain(false); });
      } else if(state === "manual_choice"){
        ctrl.innerHTML = '<button class="btn" id="ch5ManualClose">重合</button>'+
          '<button class="btn primary" id="ch5ManualBlock">闭锁重合闸</button>';
        document.getElementById("ch5ManualClose").addEventListener("click", function(){ manualDecide(true); });
        document.getElementById("ch5ManualBlock").addEventListener("click", function(){ manualDecide(false); });
      } else {
        ctrl.innerHTML = '<button class="btn primary" id="ch5Next">'+(round<rounds.length-1?"下一步":"提交操作记录")+'</button>';
        document.getElementById("ch5Next").addEventListener("click", function(){
          if(round < rounds.length-1){ round++; state="ready"; closed=false; playT=0; lastMsg=""; draw(); }
          else submit();
        });
      }
    }

    function startFault(){
      if(state !== "ready") return;
      const r = rounds[round];
      state = "timing";
      closed = false;
      playT = 0;
      draw();
      if(r.type === "manual"){
        state = "manual_choice";
        draw();
        log.innerHTML = "值班员已手动分闸，线路停电检修。重合闸装置开始计时——此时应不应该让它自动重合？";
        return;
      }
      if(r.type === "single") log.innerHTML = "A 相接地，B、C 两相健全。220 kV 线路该只重合故障相，还是三相一起重合？先在窗口内想清楚，再按按钮。";
      else if(r.type === "sync") log.innerHTML = "双侧电源线路，断路器跳开后线路侧无压、母线侧仍有压。直接合闸会带来相角冲击，先想好要不要检同期。";
      else log.innerHTML = r.type === "permanent"
        ? "断路器已跳闸。先按正常逻辑重合一次，看看故障是不是永久性的。"
        : "断路器已跳闸。绿色窗口是电弧熄灭、可以去游离的时间段，盯住游标。";
      startTiming(r);
    }

    function startTiming(r){
      if(stopRaf){ stopRaf(); stopRaf = null; }
      startTs = 0;
      stopRaf = raf(function(ts){
        if(!startTs) startTs = ts;
        playT = Math.min(TMAX, (ts - startTs) / 1000);
        const play = document.getElementById("ch5Play");
        const txt = document.getElementById("ch5PlayTxt");
        if(play){ play.setAttribute("x1", xOf(playT)); play.setAttribute("x2", xOf(playT)); }
        if(txt){ txt.setAttribute("x", xOf(playT)); txt.textContent = playT.toFixed(2)+"s"; }
        const clock = document.getElementById("ch5Clock");
        if(clock) clock.innerHTML = playT.toFixed(2)+'<small>s</small>';
        if(playT >= TMAX){
          if(stopRaf){ stopRaf(); stopRaf = null; }
          if(state === "timing"){ timeout(); }
        }
      });
    }

    function stopTiming(){ if(stopRaf){ stopRaf(); stopRaf = null; } }

    function doClose(mode){
      if(state !== "timing") return;
      const r = rounds[round];
      const mx = r.mx;
      stopTiming();
      closed = true;
      state = "closed";
      if(playT < r.ws){
        score += 0;
        state = "reclosed_fail";
        draw();
        log.innerHTML = '<span class="bad">重合过早。</span> t='+playT.toFixed(2)+' s，故障点电弧尚未熄灭，相当于重合于故障，断路器会再次跳闸并承受二次冲击。'+
          '<span class="line" style="color:var(--dim)">本步 0 / '+mx+' 分</span>';
        closeContinue();
        return;
      }
      if(playT > r.we + 0.35){
        score += 0;
        state = "reclosed_fail";
        draw();
        log.innerHTML = '<span class="bad">重合过晚。</span> t='+playT.toFixed(2)+' s，系统功角已经摆开，重合冲击可能破坏并列运行稳定性。'+
          '<span class="line" style="color:var(--dim)">本步 0 / '+mx+' 分</span>';
        closeContinue();
        return;
      }
      if(r.type === "permanent"){
        state = "trip_again";
        score += Math.round(mx * 7 / 15);
        draw();
        log.innerHTML = '<span class="warn">重合成功，但故障仍然存在。</span> 断路器再次跳闸——这说明是永久性故障。是否再重合一次？'+
          '<span class="line" style="color:var(--dim)">已得 '+Math.round(mx*7/15)+' / '+mx+' 分</span>';
        return;
      }
      if(r.type === "single" && mode === "three"){
        score += Math.round(mx * 8 / 15);
        state = "success";
        draw();
        log.innerHTML = '<span class="warn">三相重合。</span> t='+playT.toFixed(2)+' s 落在窗口内，供电恢复了，但 B、C 两相并没有故障，却被无谓停电一次，对系统冲击也更大。220 kV 及以上线路应优先采用单相重合闸，只重合故障相。'+
          '<span class="line" style="color:var(--dim)">本步 '+Math.round(mx*8/15)+' / '+mx+' 分</span>';
        closeContinue();
        return;
      }
      if(r.type === "sync" && mode === "direct"){
        score += 0;
        state = "reclosed_fail";
        draw();
        log.innerHTML = '<span class="bad">非同期合闸。</span> 两侧电压相角差没有校验就合闸，合闸瞬间产生很大的冲击电流，严重时会把两侧系统拖入失步。双侧电源线路重合前必须检同期（或一侧检无压、另一侧检同期）。'+
          '<span class="line" style="color:var(--dim)">本步 0 / '+mx+' 分</span>';
        closeContinue();
        return;
      }
      if(r.type === "sync"){
        score += mx;
        state = "success";
        draw();
        log.innerHTML = '<span class="ok">检同期重合成功。</span> 等待两侧电压相角差进入允许范围再合闸，冲击最小，供电恢复。'+
          '<span class="line" style="color:var(--dim)">本步 '+mx+' / '+mx+' 分</span>';
        closeContinue();
        return;
      }
      score += mx;
      state = "success";
      draw();
      log.innerHTML = '<span class="ok">'+(r.type==="single"?"单相重合成功，只重合了故障相。":"重合成功，供电恢复。")+'</span> t='+playT.toFixed(2)+' s 落在窗口内，故障已被清除。'+
        '<span class="line" style="color:var(--dim)">本步 '+mx+' / '+mx+' 分</span>';
      closeContinue();
    }

    function closeContinue(){
      ctrl.innerHTML = '<button class="btn primary" id="ch5Next">'+(round<rounds.length-1?"下一步":"提交操作记录")+'</button>';
      document.getElementById("ch5Next").addEventListener("click", function(){
        if(round < rounds.length-1){ round++; state="ready"; closed=false; playT=0; draw(); }
        else submit();
      });
    }

    function timeout(){
      if(state !== "timing") return;
      state = "reclosed_fail";
      playT = TMAX;
      draw();
      const tmsg = rounds[round].type === "transient"
        ? "瞬时性故障本可恢复的供电没有恢复。" 
        : rounds[round].type === "permanent" ? "永久性故障本就不该重合，但这一轮你应该先重合一次确认。" 
        : rounds[round].type === "single" ? "A 相接地本可只跳一相、重合后继续送电。" 
        : "双侧电源线路本可检同期恢复并列。";
      log.innerHTML = '<span class="bad">错过了重合窗口。</span> 计时走到 '+TMAX.toFixed(1)+' s 仍未重合，相当于闭锁重合闸，'+tmsg+
        '<span class="line" style="color:var(--dim)">本步 0 / '+rounds[round].mx+' 分</span>';
      closeContinue();
    }

    function decideAgain(again){
      const mx = rounds[round].mx, first = Math.round(mx * 7 / 15);
      if(again){
        state = "reclosed_fail";
        draw();
        log.innerHTML = '<span class="bad">重复重合失败。</span> 永久性故障下第二次重合仍然失败，只会让断路器和系统多受一次冲击。规程要求：一般不重复重合。'+
          '<span class="line" style="color:var(--dim)">本步 '+first+' / '+mx+' 分（只计入第一次重合）</span>';
      } else {
        score += mx - first;
        state = "success";
        draw();
        log.innerHTML = '<span class="ok">正确闭锁。</span> 确认永久性故障后不再重合，线路停电检修，避免重复冲击。重合闸动作一次即闭锁。'+
          '<span class="line" style="color:var(--dim)">本步 '+mx+' / '+mx+' 分（第一次重合 '+first+' + 闭锁 '+(mx-first)+'）</span>';
      }
      ctrl.innerHTML = '<button class="btn primary" id="ch5Next">'+(round<rounds.length-1?"下一步":"提交操作记录")+'</button>';
      document.getElementById("ch5Next").addEventListener("click", function(){
        if(round < rounds.length-1){ round++; state="ready"; closed=false; playT=0; draw(); }
        else submit();
      });
    }

    function manualDecide(doCloseManual){
      if(doCloseManual){
        state = "reclosed_fail";
        draw();
        log.innerHTML = '<span class="bad">危险操作。</span> 值班员手动分闸是为了检修，重合闸此时必须闭锁；强行重合会把线路重新带电，直接威胁检修人员安全。'+
          '<span class="line" style="color:var(--dim)">本步 0 / '+rounds[round].mx+' 分</span>';
      } else {
        score += rounds[round].mx;
        state = "success";
        draw();
        log.innerHTML = '<span class="ok">正确闭锁。</span> 手动跳闸（或遥控跳闸）后重合闸应自动闭锁，直到运行人员重新投入。这是重合闸"不重复重合"要求的延伸。'+
          '<span class="line" style="color:var(--dim)">本步 '+rounds[round].mx+' / '+rounds[round].mx+' 分</span>';
      }
      ctrl.innerHTML = '<button class="btn primary" id="ch5Next">'+(round<rounds.length-1?"下一步":"提交操作记录")+'</button>';
      document.getElementById("ch5Next").addEventListener("click", function(){
        if(round < rounds.length-1){ round++; state="ready"; closed=false; playT=0; draw(); }
        else submit();
      });
    }

    function submit(){
      stopTiming();
      startMode();
    }

    /* ---------- 第二关：重合闸方式配置 ---------- */
    const MODE = [
      {id:"a", n:"场景 A · 110 kV 单电源辐射线路", d:"功率只往一个方向送，没有联络，也没有同期问题", right:"three",
       why:"单电源线路不存在非同期合闸风险，三相重合闸结构最简单、成功率也最高，没有必要为它配单相重合。"},
      {id:"b", n:"场景 B · 220 kV 双电源联络线路", d:"两侧都有电源，线路长、负荷重，停电范围要尽量小", right:"single",
       why:"优先采用单相重合闸：只重合故障相，健全两相继续送电，对系统冲击最小；配合检同期还能避免相角冲击。"},
      {id:"c", n:"场景 C · 220 kV 同杆并架双回线路", d:"既有单相接地，也可能出现相间故障，两种形态都要覆盖", right:"comp",
       why:"综合重合闸按故障类型分别处理：单相故障跳单相、单相重合，相间故障跳三相、三相重合，一套装置覆盖两种形态。"}
    ];
    const MODE_OPTS = [{k:"three",n:"三相重合闸"},{k:"single",n:"单相重合闸"},{k:"comp",n:"综合重合闸"}];
    let modePick = {}, modeDone = false, modeScore = 0, modeTry = 0;

    function renderMode(){
      tag.textContent = '第二关 · 重合闸方式配置';
      stage.innerHTML =
        '<div style="font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:10px">同一条线路该配哪种重合闸方式，取决于电源数量、线路重要程度和可能的故障形态。给三个现场各配一种。</div>'+
        MODE.map(function(x){
          const cur = modePick[x.id];
          return '<div style="border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin:10px 0;background:rgba(255,255,255,.02)">'+
            '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">'+
              '<b style="font-size:13px;font-weight:500">'+x.n+'</b>'+
              '<span class="mono" style="font-size:10px;color:'+(cur?(cur===x.right?'var(--cyan)':'var(--red)'):'var(--dim)')+'">'+
                (cur?(cur===x.right?'已选：'+MODE_OPTS.filter(function(o){return o.k===cur;})[0].n:'待调整'):'未选择')+'</span>'+
            '</div>'+
            '<div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin:5px 0 10px">'+x.d+'</div>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
              MODE_OPTS.map(function(o){
                const on = cur === o.k;
                return '<button class="btn sm '+(on?"primary":"")+'" data-mode2="'+x.id+'" data-opt="'+o.k+'" '+(modeDone?'disabled':'')+'>'+o.n+'</button>';
              }).join("")+
            '</div>'+
            (modeDone ? '<div style="margin-top:9px;font-size:11.5px;line-height:1.7;color:'+(cur===x.right?'var(--cyan)':'var(--red)')+'">'+(cur===x.right?'✓ 正确。':'✕ 不适用。')+x.why+'</div>' : '')+
          '</div>';
        }).join("");
      readout.innerHTML =
        '<div class="ro"><span>已配置</span><b>'+Object.keys(modePick).length+'<small>/3</small></b></div>'+
        '<div class="ro"><span>配置正确</span><b style="color:'+(modeDone?(modeScore>=20?'var(--cyan)':'var(--amber)'):'var(--muted)')+'">'+(modeDone?MODE.filter(function(x){return modePick[x.id]===x.right;}).length:"—")+'<small>/3</small></b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+modeScore+'<small>/20</small></b></div>'+
        '<div class="ro"><span>累计得分</span><b>'+score+'<small>/80</small></b></div>';
      if(!modeDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch5ModeSubmit" '+(Object.keys(modePick).length===3?'':'disabled')+'>提交配置方案</button>';
        document.getElementById("ch5ModeSubmit").addEventListener("click", submitMode);
      } else {
        ctrl.innerHTML = '<button class="btn" id="ch5ModeAgain">重新配置</button>'+
          '<button class="btn primary" id="ch5ModeEnd">提交操作记录</button>';
        document.getElementById("ch5ModeAgain").addEventListener("click", startMode);
        document.getElementById("ch5ModeEnd").addEventListener("click", finishAll5);
      }
      stage.querySelectorAll("[data-mode2]").forEach(function(b){
        b.addEventListener("click", function(){
          if(modeDone) return;
          modePick[b.getAttribute("data-mode2")] = b.getAttribute("data-opt");
          renderMode();
        });
      });
    }

    function startMode(){
      modePick = {}; modeDone = false; modeScore = 0; modeTry = 0;
      renderMode();
      log.innerHTML = '时序都掌握了，最后一步是配置：这条线路到底该装三相、单相还是综合重合闸？电源数量决定要不要选相，故障形态决定要不要兼顾相间。';
    }

    function submitMode(){
      modeTry++;
      const right = MODE.filter(function(x){ return modePick[x.id] === x.right; }).length;
      modeScore = right*6 + (right===3 ? 2 : 0);
      modeDone = true;
      const wrongs = MODE.filter(function(x){ return modePick[x.id] !== x.right; });
      log.innerHTML = (right===3
          ? '<span class="ok">三个现场全部配置正确。</span> 辐射线路求简用三相、双电源联络线用单相保供电、同杆双回用综合兼顾两种故障形态。'
          : '<span class="bad">'+wrongs.length+' 处配置不适用。</span> '+wrongs.map(function(x){ return x.n+' 更适合'+MODE_OPTS.filter(function(o){return o.k===x.right;})[0].n; }).join('；')+'。')+
        '<span class="line" style="color:var(--dim)">本关得分 '+modeScore+' / 20（第 '+modeTry+' 次提交）</span>';
      renderMode();
    }

    function finishAll5(){
      const total = Math.min(100, score + modeScore);
      const st = total >= 85 ? 3 : total >= 60 ? 2 : 1;
      finish(5, total, st, [
        "重合时限要大于故障点电弧去游离时间，同时不能长到让系统失去稳定，工程上常取 0.5~1.5 s。",
        "永久性故障只重合一次：第二次跳闸后必须闭锁，避免反复冲击断路器与系统。",
        "手动跳闸、遥控跳闸或合闸于故障时，重合闸都应闭锁；重要线路还可采用检无压、检同期方式。"
      ], "自动重合闸在断路器跳闸后自动重合，作用是提高供电可靠性、提高系统并列运行稳定性、纠正保护误动造成的误跳。基本要求：动作迅速且满足去游离时间、不重复重合、手动跳闸后闭锁、与继电保护配合、优先采用单相重合闸、必要时检无压或检同期。");
    }

    draw();
    return function(){ stopTiming(); };
  }
};

      {id:"B", name:"区外故障 · CT 误差", i1:6.0, i2:4.9, h2:2, want:false, note:"区外短路电流大，两侧 CT 误差产生不平衡电流，必须靠比率制动躲过。"},
      {id:"C", name:"内部故障 · 轻微", i1:3.5, i2:2.5, h2:13, want:true, note:"变压器内部故障，差动电流明显；但故障电流中也含一定二次谐波。"},
      {id:"D", name:"空载合闸 · 励磁涌流", i1:7.0, i2:0, h2:24, want:false, note:"合闸瞬间只有一侧有电流，波形偏置、二次谐波含量很高，必须制动。"},
      {id:"E", name:"区外故障 · 大电流穿越", i1:8.0, i2:6.5, h2:3, want:false, note:"穿越电流越大，两侧 CT 误差造成的不平衡电流越大，比率制动必须按最严重情况整定。"}
    ];
    let K = 0.15, H = 10, sel = 0, phase = 1, scoreA = 0;
    let busRound = 0, busScore = 0;
    let bqf = {QF0:false, QF1:false, QF2:false, QF3:false};
    let busActed = false, busBest = [0,0];

    const stage = document.getElementById("ch6Stage");
    const readout = document.getElementById("ch6Readout");
    const ctrl = document.getElementById("ch6Ctrl");
    const log = document.getElementById("ch6Log");
    const tag = document.getElementById("ch6Tag");
    const side = document.getElementById("ch6Side");
    let aSubmitted = false;

    function calc(s){
      const id = Math.abs(s.i1 - s.i2);
      const ir = (s.i1 + s.i2) / 2;
      const th = Math.max(0.5, K * ir);
      const op = id > th && s.h2 < H;
      return {id:id, ir:ir, th:th, op:op};
    }

    /* ---------- 阶段一 ---------- */
    function trafoSvg(){
      const s = scen[sel];
      const c = calc(s);
      let g = '<svg viewBox="0 0 760 320" role="img" aria-label="变压器差动保护">'+SVG_DEFS;
      g += '<g stroke="#16242f" stroke-width="1">';
      for(let x=20;x<760;x+=40) g += '<line x1="'+x+'" y1="20" x2="'+x+'" y2="290"/>';
      g += '</g>';
      // 母线
      g += '<line x1="80" y1="100" x2="80" y2="200" stroke="#6ea8ff" stroke-width="5" opacity=".8"/>';
      g += '<line x1="560" y1="100" x2="560" y2="200" stroke="#6ea8ff" stroke-width="5" opacity=".8"/>';
      g += '<text x="80" y="222" text-anchor="middle" font-size="9" fill="#6ea8ff" font-family="ui-monospace,Menlo,monospace">一次侧</text>';
      g += '<text x="560" y="222" text-anchor="middle" font-size="9" fill="#6ea8ff" font-family="ui-monospace,Menlo,monospace">二次侧</text>';
      // 导线
      g += '<line x1="80" y1="150" x2="250" y2="150" stroke="#4d6a80" stroke-width="2"/>';
      g += '<line x1="330" y1="150" x2="560" y2="150" stroke="#4d6a80" stroke-width="2"/>';
      // CT
      [[170,"CT1"],[450,"CT2"]].forEach(function(ct){
        g += '<rect x="'+(ct[0]-7)+'" y="141" width="14" height="18" rx="2" fill="none" stroke="#8ba3b7" stroke-width="1"/>';
        g += '<text x="'+ct[0]+'" y="178" text-anchor="middle" font-size="8" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">'+ct[1]+'</text>';
      });
      // 绕组
      [[250],[330]].forEach(function(w,x){
        for(let y=118; y<=182; y+=16){
          g += '<path d="M'+w[0]+' '+y+'a8 8 0 0 1 0 16" fill="none" stroke="#3ed6c4" stroke-width="1.6" opacity=".85"/>';
        }
      });
      // 铁芯
      g += '<rect x="282" y="112" width="16" height="80" fill="rgba(139,163,183,.08)" stroke="#2b4557" stroke-width="1"/>';
      g += '<line x1="290" y1="112" x2="290" y2="192" stroke="#5e7488" stroke-width="1" stroke-dasharray="3 3"/>';
      // 差动继电器
      g += '<rect x="340" y="34" width="80" height="34" rx="4" fill="'+(c.op?"rgba(242,99,111,.12)":"rgba(62,214,196,.06)")+'" stroke="'+(c.op?"#f2636f":"#2b4557")+'" stroke-width="1.2"/>';
      g += '<text x="380" y="56" text-anchor="middle" font-size="10" fill="'+(c.op?"#f2636f":"#3ed6c4")+'" font-family="ui-monospace,Menlo,monospace">'+(c.op?"TRIP":"BLOCK")+'</text>';
      g += '<line x1="170" y1="132" x2="360" y2="70" stroke="#2b4557" stroke-width="1" stroke-dasharray="5 4"/>';
      g += '<line x1="450" y1="132" x2="400" y2="70" stroke="#2b4557" stroke-width="1" stroke-dasharray="5 4"/>';
      // 电流箭头
      g += '<line x1="96" y1="130" x2="160" y2="130" stroke="#3ed6c4" stroke-width="' + (s.i1>4?7:4) + '" opacity=".3"/>';
      g += '<line x1="96" y1="130" x2="160" y2="130" stroke="#3ed6c4" stroke-width="1.6" marker-end="url(#arwC)"/>';
      g += '<text x="128" y="120" text-anchor="middle" font-size="9.5" fill="#3ed6c4" font-family="ui-monospace,Menlo,monospace">I₁ '+s.i1.toFixed(1)+'</text>';
      if(s.i2 > 0){
        g += '<line x1="440" y1="130" x2="540" y2="130" stroke="#3ed6c4" stroke-width="' + (s.i2>4?7:4) + '" opacity=".3"/>';
        g += '<line x1="440" y1="130" x2="540" y2="130" stroke="#3ed6c4" stroke-width="1.6" marker-end="url(#arwC)"/>';
      }
      g += '<text x="490" y="120" text-anchor="middle" font-size="9.5" fill="'+ (s.i2>0?"#3ed6c4":"#5e7488") +'" font-family="ui-monospace,Menlo,monospace">I₂ '+s.i2.toFixed(1)+'</text>';
      // 故障标记
      if(s.id === "C"){
        g += '<circle cx="290" cy="150" r="22" fill="rgba(242,99,111,.10)" stroke="#f2636f" stroke-width="1"/>';
        g += '<text x="290" y="238" text-anchor="middle" font-size="9.5" fill="#f2636f" font-family="ui-monospace,Menlo,monospace">内部故障</text>';
      }
      if(s.id === "B" || s.id === "E"){
        g += '<circle cx="520" cy="150" r="18" fill="rgba(242,99,111,.10)" stroke="#f2636f" stroke-width="1"/>';
        g += '<path d="M514 143L520 150L515 154L521 160" stroke="#f2636f" stroke-width="2" fill="none"/>';
        g += '<text x="520" y="238" text-anchor="middle" font-size="9.5" fill="#f2636f" font-family="ui-monospace,Menlo,monospace">区外故障</text>';
      }
      if(s.id === "D"){
        g += '<text x="290" y="238" text-anchor="middle" font-size="9.5" fill="#f4b74a" font-family="ui-monospace,Menlo,monospace">单侧涌流 · 二次谐波 24%</text>';
      }
      g += '</svg>';
      return g;
    }

    function aStatus(){
      return scen.map(function(s){
        const c = calc(s);
        return {s:s, c:c, ok:(c.op === s.want)};
      });
    }

    function syncA(){
      const s = scen[sel];
      const c = calc(s);
      const allOk = aStatus().every(function(x){ return x.ok; });
      readout.innerHTML =
        '<div class="ro"><span>差动电流 I_d</span><b>'+(Math.abs(s.i1-s.i2)).toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>制动电流 I_r</span><b>'+c.ir.toFixed(2)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>二次谐波含量</span><b>'+s.h2+'<small>%</small></b></div>'+
        '<div class="ro"><span>保护判据</span><b style="font-size:13px;color:'+(c.op?"var(--red)":"var(--cyan)")+'">'+(c.op?"动作":"制动")+(aSubmitted?(c.op===s.want?" ✓":" ✗"):"")+'</b></div>';
      side.textContent = aSubmitted ? (allOk ? "五种工况全部判断正确" : "仍有工况判断错误") : "调好 K 与谐波制动，再校验五种工况";
      aStatus().forEach(function(x){
        const row = document.getElementById("ch6Row"+x.s.id);
        if(row){
          const show = aSubmitted || x.s === scen[sel];
          const st = document.getElementById("ch6St"+x.s.id);
          if(st){
            st.textContent = show ? ((x.c.op ? "动作" : "制动") + (aSubmitted ? (x.ok ? " ✓" : " ✗") : "")) : "—";
            st.style.color = !show ? "var(--dim)" : (aSubmitted ? (x.ok ? "#3ed6c4" : "#f2636f") : "#8ba3b7");
          }
          row.style.borderLeftColor = aSubmitted ? (x.ok ? "#3ed6c4" : "#f2636f") : (x.s === scen[sel] ? "#3ed6c4" : "#2b4557");
        }
      });
    }

    function renderA(){
      tag.innerHTML = '阶段 <b>1</b> / 3 · 变压器差动整定';
      side.textContent = "目标：五种工况全部判断正确";
      const btns = scen.map(function(s){
        return '<button class="btn sm" data-sel="'+s.id+'" style="flex:1 1 150px;min-width:0;border-color:'+(sel===scen.indexOf(s)?"var(--cyan)":"var(--line2)")+'">'+s.name+'</button>';
      }).join("");
      const rows = scen.map(function(s){
        return '<div id="ch6Row'+s.id+'" style="border:1px solid #1d2f3f;border-left:2px solid #2b4557;padding:7px 10px;background:rgba(255,255,255,.02);font-size:11px;line-height:1.5;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex:1 1 160px;min-width:0">'+
          '<span>'+s.name+'</span><span class="mono" id="ch6St'+s.id+'" style="flex:none">—</span></div>';
      }).join("");
      stage.innerHTML = trafoSvg() +
        '<div class="k-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin-top:10px">'+
          '<div class="slider-row" style="margin:0"><label>比率制动 K</label><input type="range" id="ch6K" min="0.10" max="0.60" step="0.01" value="'+K+'"><span class="val" id="ch6KV">'+K.toFixed(2)+'</span></div>'+
          '<div class="slider-row" style="margin:0"><label>二次谐波制动</label><input type="range" id="ch6H" min="5" max="30" step="1" value="'+H+'"><span class="val" id="ch6HV">'+H+'%</span></div>'+
        '</div>'+
        '<div class="eyebrow" style="margin:14px 0 7px">选择工况观察</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+btns+'</div>'+
        '<div class="eyebrow" style="margin:14px 0 7px">五种工况的判断</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+rows+'</div>'+
        '<p class="tip" style="margin:10px 0 0">期望：内部故障动作，其余四种工况制动。观察每次切换工况后差动电流 I_d 与二次谐波含量的变化。</p>';
      document.getElementById("ch6K").addEventListener("input", function(e){ K = Number(e.target.value); document.getElementById("ch6KV").textContent = K.toFixed(2); syncA(); });
      document.getElementById("ch6H").addEventListener("input", function(e){ H = Number(e.target.value); document.getElementById("ch6HV").textContent = H+"%"; syncA(); });
      stage.querySelectorAll("[data-sel]").forEach(function(b){
        b.addEventListener("click", function(){
          sel = scen.findIndex(function(x){ return x.id === b.getAttribute("data-sel"); });
          renderA();
        });
      });
      ctrl.innerHTML = '<button class="btn primary" id="ch6SubmitA">校验整定</button>';
      document.getElementById("ch6SubmitA").addEventListener("click", submitA);
      log.innerHTML = scen[sel].note;
      syncA();
    }

    function submitA(){
      aSubmitted = true;
      const res = aStatus();
      const okN = res.filter(function(x){ return x.ok; }).length;
      scoreA = okN * 8;
      syncA();
      log.innerHTML = res.map(function(x){
        return '<span class="line">'+(x.ok?'<span class="ok">✓ ':'<span class="bad">✗ ')+x.s.name+"：判据"+(x.c.op?"动作":"制动")+'，应为'+(x.s.want?"动作":"制动")+'</span>';
      }).join("")+'<span class="line" style="color:var(--dim)">本阶段得分 '+scoreA+' / 40</span>';
      if(okN === 5){
        log.innerHTML += '<span class="line"><span class="ok">整定正确。</span> K='+K.toFixed(2)+' 足以躲过区外故障的不平衡电流，二次谐波制动 '+H+'% 既能挡住 24% 的涌流，又不影响 13% 的内部故障。</span>';
      } else {
        log.innerHTML += '<span class="line"><span class="warn">还需要调整：</span>'+(K < 0.202 ? '比率制动系数偏小，区外故障会误动。' : K > 0.333 ? '比率制动系数偏大，轻微内部故障会拒动。' : '')+(H <= 13 ? ' 二次谐波制动比偏低，内部故障会被误制动。' : H > 24 ? ' 二次谐波制动比偏高，挡不住励磁涌流。' : '')+'</span>';
      }
      phase = 2;
      ctrl.innerHTML = '<button class="btn primary" id="ch6ToBus">进入母线保护</button>';
      document.getElementById("ch6ToBus").addEventListener("click", renderB);
    }

    /* ---------- 阶段二 ---------- */
    const busFaults = [
      {id:"BUS", name:"母线内部短路", internal:true, best:3, x:380, y:120},
      {id:"L2", name:"线路 L2 近端故障（区外）", internal:false, best:1, x:380, y:250}
    ];

    function busEnergy(){
      const bus = !bqf.QF0;
      const L1 = bus && !bqf.QF1;
      const L2 = bus && !bqf.QF2;
      const L3 = bus && !bqf.QF3;
      return {bus:bus, L1:L1, L2:L2, L3:L3};
    }

    function busCleared(f){
      const e = busEnergy();
      if(f.internal) return !e.bus;
      return !e.L2;
    }

    function busOutage(f){
      const e = busEnergy();
      const on = (f.internal ? 0 : 0) + (e.L1?1:0) + (f.internal?0:(e.L2?1:0)) + (e.L3?1:0);
      return 3 - on;
    }

    function busSvg(){
      const f = busFaults[busRound];
      let g = '<svg viewBox="0 0 760 340" role="img" aria-label="母线保护">'+SVG_DEFS;
      g += '<g stroke="#16242f" stroke-width="1">';
      for(let x=20;x<760;x+=40) g += '<line x1="'+x+'" y1="20" x2="'+x+'" y2="310"/>';
      g += '</g>';
      // 母线
      g += '<line x1="160" y1="120" x2="600" y2="120" stroke="'+(bqf.QF0?"#4a5f70":"#3ed6c4")+'" stroke-width="7" opacity=".8"/>';
      g += '<text x="380" y="102" text-anchor="middle" font-size="10" fill="#8ba3b7" font-family="ui-monospace,Menlo,monospace">母线</text>';
      // 电源 + QF0
      g += '<circle cx="60" cy="120" r="16" fill="rgba(110,168,255,.08)" stroke="#6ea8ff" stroke-width="1.2"/>';
      g += '<path d="M54 115c2 6 4 6 6 0s4-6 6 0" stroke="#6ea8ff" stroke-width="1.2" fill="none"/>';
      g += '<line x1="78" y1="120" x2="120" y2="120" stroke="#4d6a80" stroke-width="2"/>';
      g += qfNode("QF0", 140, 120, bqf.QF0, false);
      // 三条出线
      [[240,"QF1","L1"],[380,"QF2","L2"],[520,"QF3","L3"]].forEach(function(b){
        g += '<line x1="'+b[0]+'" y1="120" x2="'+b[0]+'" y2="180" stroke="'+(bqf[b[1]]?"#384d5c":"#4d6a80")+'" stroke-width="2"/>';
        g += qfNode(b[1], b[0], 190, bqf[b[1]], true);
        g += '<line x1="'+b[0]+'" y1="200" x2="'+b[0]+'" y2="250" stroke="'+(bqf[b[1]]?"#384d5c":"#4d6a80")+'" stroke-width="2"/>';
        g += '<rect x="'+(b[0]-20)+'" y="250" width="40" height="30" rx="3" fill="rgba(255,255,255,.03)" stroke="#8ba3b7" stroke-width="1"/>';
        g += '<path d="M'+(b[0]-8)+' 258l8 10 8-10" stroke="#8ba3b7" stroke-width="1.1" fill="none"/>';
        g += '<text x="'+b[0]+'" y="298" text-anchor="middle" font-size="9" fill="#8ba3b7" font-family="ui-monospace,Menlo,monospace">负荷 '+b[2]+'</text>';
      });
      // 故障
      g += '<circle cx="'+f.x+'" cy="'+f.y+'" r="18" fill="rgba(242,99,111,.10)" stroke="rgba(242,99,111,.6)" stroke-width="1"/>';
      g += '<path d="M'+(f.x-7)+' '+(f.y-12)+'L'+(f.x-1)+' '+(f.y-2)+'L'+(f.x-6)+' '+(f.y+2)+'L'+(f.x+2)+' '+(f.y+12)+'" stroke="#f2636f" stroke-width="2.2" fill="none"/>';
      g += '<text x="'+f.x+'" y="'+(f.internal? 88 : 285)+'" text-anchor="middle" font-size="9.5" fill="#f2636f" font-family="ui-monospace,Menlo,monospace">'+(f.internal?"母线内故障":"区外故障")+'</text>';
      g += '</svg>';
      return g;
    }

    function qfNode(id, x, y, open, small){
      const col = open ? "#f2636f" : "#3ed6c4";
      const w = 22;
      return '<g data-bqf="'+id+'" style="cursor:pointer">'+
        '<rect x="'+(x-22)+'" y="'+(y-22)+'" width="44" height="44" fill="transparent"/>'+
        '<rect x="'+(x-w/2)+'" y="'+(y-w/2)+'" width="'+w+'" height="'+w+'" rx="3" fill="'+(open?"rgba(242,99,111,.14)":"rgba(62,214,196,.1)")+'" stroke="'+col+'" stroke-width="1.4"/>'+
        (open ? '<path d="M'+(x-4)+' '+(y-4)+'L'+(x+4)+' '+(y+4)+'M'+(x+4)+' '+(y-4)+'L'+(x-4)+' '+(y+4)+'" stroke="'+col+'" stroke-width="1.3"/>'
              : '<path d="M'+(x-4)+' '+y+'L'+(x+4)+' '+y+'" stroke="'+col+'" stroke-width="2"/>')+
        '<text x="'+x+'" y="'+(y+30)+'" text-anchor="middle" font-size="9" fill="'+col+'" font-family="ui-monospace,Menlo,monospace">'+id+'</text>'+
        '</g>';
    }

    function renderB(){
      tag.innerHTML = '阶段 <b>2</b> / 3 · 母线保护';
      side.textContent = "故障 "+(busRound+1)+" / 2";
      stage.innerHTML = busSvg();
      const e = busEnergy();
      const f = busFaults[busRound];
      const opened = Object.keys(bqf).filter(function(k){ return bqf[k]; });
      readout.innerHTML =
        '<div class="ro"><span>已断开开关</span><b style="font-size:13px">'+(opened.length?opened.join(" / "):"无")+'</b></div>'+
        '<div class="ro"><span>失电负荷</span><b>'+(3-((e.L1?1:0)+(e.L2?1:0)+(e.L3?1:0)))+'<small>个</small></b></div>'+
        '<div class="ro"><span>故障状态</span><b style="font-size:13px;color:'+(busCleared(f)?"var(--cyan)":"var(--red)")+'">'+(busCleared(f)?"已隔离":"仍在供电")+'</b></div>'+
        '<div class="ro"><span>母线保护得分</span><b>'+busBest.reduce(function(a,b){return a+b;},0)+'<small>/40</small></b></div>';
      if(busActed){
        ctrl.innerHTML = '<button class="btn primary" id="ch6BusNext">'+(busRound<1?"下一处故障":"提交实训")+'</button>';
        document.getElementById("ch6BusNext").addEventListener("click", function(){
          if(busRound < 1){ busRound++; bqf={QF0:false,QF1:false,QF2:false,QF3:false}; busActed=false; renderB(); }
          else submitAll();
        });
      } else {
        ctrl.innerHTML = '<button class="btn primary" id="ch6BusExec">执行保护</button>'+
          '<button class="btn" id="ch6BusReset">全部合上</button>';
        document.getElementById("ch6BusExec").addEventListener("click", function(){
          const cleared = busCleared(f);
          const out = busOutage(f);
          let sc = 0;
          if(cleared && out <= f.best) sc = 20;
          else if(cleared) sc = 14;
          busBest[busRound] = Math.max(busBest[busRound], sc);
          busActed = true;
          log.innerHTML = (sc === 20
            ? '<span class="ok">选择性正确。</span> '+(f.internal ? '母线内部故障，把故障母线上的所有开关全部跳开，母线可靠隔离。' : '区外故障只切 L2 的开关，另外两条出线保住供电。')
            : cleared ? '<span class="warn">故障切除了，但停电范围过大。</span> 母线保护不应把非故障出线一起切掉。'
            : '<span class="bad">故障母线仍与电源相连。</span> 母线保护拒动，后果比线路故障更严重。') +
            '<span class="line" style="color:var(--dim)">断开：'+(Object.keys(bqf).filter(function(k){return bqf[k];}).join(" / ")||"无")+' · 失电负荷 '+out+' 个 · 本步 '+sc+'/20</span>';
          renderB();
        });
        document.getElementById("ch6BusReset").addEventListener("click", function(){
          bqf={QF0:false,QF1:false,QF2:false,QF3:false}; renderB();
        });
      }
    }

    stage.addEventListener("click", function(e){
      const g = e.target.closest("[data-bqf]");
      if(!g || phase !== 2 || busActed) return;
      const id = g.getAttribute("data-bqf");
      bqf[id] = !bqf[id];
      renderB();
    });

    function submitAll(){
      startBal();
    }

    /* ---------- 阶段三：平衡系数 ---------- */
    const BAL = {i1:1.00, i2:0.82};
    let bv = 1.00, bDone = false, bScore = 0, bTry = 0;

    function balId(){ return Math.abs(BAL.i1 - bv * BAL.i2); }

    function balSvg(){
      const id = balId();
      const ok = id <= 0.02;
      const max = 1.30;
      const sx = v => 96 + clamp(v, 0, max) / max * 500;
      const rows = [
        {y:70,  v:BAL.i1,     n:"I₁ · 一次侧二次值", c:"#6ea8ff", show:BAL.i1.toFixed(2)},
        {y:112, v:BAL.i2,     n:"I₂ · 二次侧二次值", c:"#a99cf5", show:BAL.i2.toFixed(2)},
        {y:154, v:bv*BAL.i2,  n:"补偿后 K_b · I₂",     c:ok?"#3ed6c4":"#f4b74a", show:(bv*BAL.i2).toFixed(2)}
      ];
      let g = '<svg viewBox="0 0 760 236" role="img" aria-label="差动平衡系数">'+SVG_DEFS;
      g += '<text x="16" y="30" font-size="10" fill="#5e7488" font-family="ui-monospace,Menlo,monospace">变压器变比与两侧 CT 变比都不同，二次电流天然不相等，必须靠平衡系数拉齐</text>';
      rows.forEach(function(r){
        g += '<rect x="96" y="'+r.y+'" width="480" height="14" fill="#0d1a25" stroke="#1d2f3f" stroke-width="1"/>';
        g += '<rect x="96" y="'+r.y+'" width="'+Math.max(0, sx(r.v)-96)+'" height="14" fill="'+r.c+'" opacity=".28"/>';
        g += '<line x1="'+sx(r.v)+'" y1="'+(r.y-4)+'" x2="'+sx(r.v)+'" y2="'+(r.y+18)+'" stroke="'+r.c+'" stroke-width="1.6"/>';
        g += '<text x="96" y="'+(r.y-7)+'" font-size="9" fill="'+r.c+'" font-family="ui-monospace,Menlo,monospace">'+r.n+'</text>';
        g += '<text x="'+(sx(r.v)+8)+'" y="'+(r.y+11)+'" font-size="10" fill="'+r.c+'" font-family="ui-monospace,Menlo,monospace">'+r.show+' kA</text>';
      });
      g += '<line x1="96" y1="196" x2="576" y2="196" stroke="#2b4557" stroke-width="1"/>';
      g += '<text x="96" y="216" font-size="10" fill="'+(ok?"#3ed6c4":"#f2636f")+'" font-family="ui-monospace,Menlo,monospace">差动电流 I_d = |I₁ − K_b·I₂| = '+id.toFixed(3)+' kA '+(ok?"· 已平衡":"· 仍有不平衡")+'</text>';
      g += '</svg>';
      return g;
    }

    function renderBal(){
      tag.innerHTML = '阶段 <b>3</b> / 3 · 平衡系数';
      side.textContent = '目标：把差动电流压到 0.02 kA 以内';
      stage.innerHTML = balSvg()+
        '<div class="slider-row"><label>平衡系数 K<sub>b</sub></label><input type="range" id="ch6B" min="0.90" max="1.50" step="0.01" value="'+bv+'"><span class="val">'+bv.toFixed(2)+'</span></div>';
      document.getElementById("ch6B").addEventListener("input", function(e){ bv = Number(e.target.value); renderBal(); });
      readout.innerHTML =
        '<div class="ro"><span>平衡系数</span><b>'+bv.toFixed(2)+'</b></div>'+
        '<div class="ro"><span>差动电流</span><b style="color:'+(balId()<=0.02?"var(--cyan)":"var(--red)")+'">'+balId().toFixed(3)+'<small>kA</small></b></div>'+
        '<div class="ro"><span>本关得分</span><b>'+bScore+'<small>/20</small></b></div>'+
        '<div class="ro"><span>已得</span><b>'+(scoreA+busBest.reduce(function(a,b){return a+b;},0))+'<small>/80</small></b></div>';
      if(!bDone){
        ctrl.innerHTML = '<button class="btn primary" id="ch6BalRun">校核平衡系数</button>';
        document.getElementById("ch6BalRun").addEventListener("click", runBal);
      } else {
        ctrl.innerHTML = '<button class="btn" id="ch6BalAgain">再调一次</button>'+
          '<button class="btn primary" id="ch6BalEnd">提交实训记录</button>';
        document.getElementById("ch6BalAgain").addEventListener("click", function(){ bDone=false; renderBal(); });
        document.getElementById("ch6BalEnd").addEventListener("click", finishAll6);
      }
    }

    function startBal(){
      bv = 1.00; bDone = false; bScore = 0; bTry = 0;
      renderBal();
      log.innerHTML = '差动保护还有一个绕不开的问题：变压器两侧的一次电流、CT 变比都不一样，二次电流天然不相等。拖动平衡系数，让两条指针对齐。';
    }

    function runBal(){
      bTry++;
      const id = balId();
      const sc = id <= 0.02 ? 20 : id <= 0.06 ? 12 : id <= 0.12 ? 6 : 0;
      bDone = true;
      if(sc > bScore) bScore = sc;
      log.innerHTML = (sc===20
        ? '<span class="ok">已平衡。</span> K_b = '+bv.toFixed(2)+' 正好补偿了变比差异，区外故障的差动电流降到 '+id.toFixed(3)+' kA，不会误动。'
        : '<span class="bad">仍有不平衡。</span> K_b = '+bv.toFixed(2)+' 时差动电流还有 '+id.toFixed(3)+' kA，'+(bv < BAL.i1/BAL.i2 ? '负载侧补偿不够，正常运行时就会带差流。' : '补偿过头，等于把负载侧电流放大了。'))+
        '<span class="line" style="color:var(--dim)">本关得分 '+sc+' / 20 · 已记录最高分 '+bScore+' / 20（第 '+bTry+' 次校核）</span>';
      renderBal();
    }

    function finishAll6(){
      const total = Math.min(100, scoreA + busBest.reduce(function(a,b){return a+b;},0) + bScore);
      const st = total >= 90 ? 3 : total >= 70 ? 2 : 1;
      finish(6, total, st, [
        "变压器差动：内部故障看差动电流，区外故障看比率制动，空载合闸看二次谐波——三者缺一不可。",
        "母线保护是电流差动保护，按母线选择性动作：内部故障跳开母线上所有开关，区外故障只让故障线路自己跳。",
        "整定不是取最大或最小，而是在灵敏度与安全性之间找窗口：K 要躲过区外不平衡，又不能盖住轻微内部故障。"
      ], "变压器主要故障：绕组相间、匝间、接地短路及套管闪络等；异常有：过负荷、油温过高。主保护用纵差保护，需躲过励磁涌流（二次谐波制动、波形间断角判别）并做 CT 变比与接线补偿；后备保护有过电流、零序过电流、过负荷，油浸变压器还有瓦斯保护。母线保护常用电流差动，要求快速、有选择性，内部故障跳开故障母线所连全部开关，区外故障不得误动。");
    }

    renderA();
    return function(){};
  }
};

   ============================================================ */
loadStore();
updateHeader(0);
go("home");
</script>
